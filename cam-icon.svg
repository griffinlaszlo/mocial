<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="64" height="64" shape-rendering="crispEdges">
  <!-- cam: a 90s ball webcam on its little stand, lens glinting, light on -->
  <!-- outline -->
  <g fill="#000">
    <rect x="10" y="2" width="12" height="1"/>
    <rect x="7" y="3" width="18" height="2"/>
    <rect x="5" y="5" width="22" height="2"/>
    <rect x="4" y="7" width="24" height="12"/>
    <rect x="5" y="19" width="22" height="2"/>
    <rect x="7" y="21" width="18" height="2"/>
    <rect x="10" y="23" width="12" height="1"/>
    <rect x="13" y="24" width="6" height="3"/>
    <rect x="7" y="27" width="18" height="3"/>
  </g>
  <!-- the ball -->
  <g fill="#e6e6e6">
    <rect x="10" y="3" width="12" height="1"/>
    <rect x="8" y="4" width="16" height="2"/>
    <rect x="6" y="6" width="20" height="2"/>
    <rect x="5" y="8" width="22" height="10"/>
    <rect x="6" y="18" width="20" height="2"/>
    <rect x="8" y="20" width="16" height="2"/>
    <rect x="10" y="22" width="12" height="1"/>
  </g>
  <!-- shading on the ball's lower right -->
  <g fill="#a8a8a8">
    <rect x="24" y="12" width="2" height="6"/>
    <rect x="22" y="18" width="4" height="2"/>
    <rect x="18" y="20" width="6" height="2"/>
    <rect x="14" y="22" width="8" height="1"/>
  </g>
  <rect x="8" y="5" width="4" height="1" fill="#fff"/>
  <rect x="6" y="7" width="3" height="2" fill="#fff"/>
  <!-- lens: dark ring, blue glass, glint -->
  <g fill="#000">
    <rect x="12" y="7" width="8" height="1"/>
    <rect x="10" y="8" width="12" height="2"/>
    <rect x="9" y="10" width="14" height="6"/>
    <rect x="10" y="16" width="12" height="2"/>
    <rect x="12" y="18" width="8" height="1"/>
  </g>
  <g fill="#1d3fa8">
    <rect x="12" y="9" width="8" height="1"/>
    <rect x="11" y="10" width="10" height="6"/>
    <rect x="12" y="16" width="8" height="1"/>
  </g>
  <rect x="13" y="11" width="6" height="4" fill="#3b7bff"/>
  <rect x="15" y="12" width="2" height="2" fill="#0b1640"/>
  <rect x="13" y="11" width="2" height="1" fill="#cfe4ff"/>
  <rect x="13" y="12" width="1" height="1" fill="#cfe4ff"/>
  <!-- the light's on -->
  <rect x="22" y="7" width="2" height="2" fill="#ff2a2a"/>
  <!-- stand -->
  <rect x="14" y="24" width="4" height="3" fill="#7a7a7a"/>
  <rect x="8" y="28" width="16" height="1" fill="#c8c8c8"/>
  <rect x="8" y="27" width="16" height="1" fill="#e6e6e6"/>
</svg>
