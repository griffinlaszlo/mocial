<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Set your dial</title>
<!--
  SET YOUR DIAL — a pared-down version of Marc's radio app, as a Bond creation (by marc).
  Taste → lineup → the birth of the dial (with naming) → your dial. Styles, chips, the talking host,
  the sparkle chips and the birth animation are lifted from the original app; media from its assets.
  window.MarcDial = { mute(bool) }.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@500;600;700;800&display=swap">
<style>

:root{
  --bg:#EDEDE8; --phone:#F7F7F4; --surface:#FFFFFF; --surface2:#EFEFEA;
  --ink:#111110; --muted:#6F6F68; --line:#E5E5DF;
  --accent:#FF4B1F; --accent-soft:rgba(255,75,31,.10); --on-accent:#FFFFFF;
  --live:#18A04B; --live-soft:rgba(24,160,75,.14); --on-live:#FFFFFF;
  --gold:#B07E0A; --gold-soft:rgba(201,147,10,.12);
  --scrim:rgba(17,17,16,.44); --shadow:0 24px 70px rgba(17,17,16,.18);
  --inset:inset 0 2px 6px rgba(17,17,16,.10), inset 0 -1px 0 rgba(255,255,255,.6);
}
:root:not([data-theme="light"]){ }
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#060606; --phone:#0C0C0B; --surface:#161615; --surface2:#1F1F1D;
    --ink:#F3F3EF; --muted:#98988F; --line:#262624;
    --accent:#FF5A2E; --accent-soft:rgba(255,90,46,.14); --on-accent:#FFFFFF;
    --live:#30D158; --live-soft:rgba(48,209,88,.18); --on-live:#08140C;
    --gold:#E3B341; --gold-soft:rgba(227,179,65,.14);
    --scrim:rgba(0,0,0,.6); --shadow:0 24px 70px rgba(0,0,0,.55);
    --inset:inset 0 2px 7px rgba(0,0,0,.55), inset 0 -1px 0 rgba(255,255,255,.05);
  }
}
:root[data-theme="dark"]{
  --bg:#060606; --phone:#0C0C0B; --surface:#161615; --surface2:#1F1F1D;
  --ink:#F3F3EF; --muted:#98988F; --line:#262624;
  --accent:#FF5A2E; --accent-soft:rgba(255,90,46,.14); --on-accent:#FFFFFF;
  --live:#30D158; --live-soft:rgba(48,209,88,.18); --on-live:#08140C;
  --gold:#E3B341; --gold-soft:rgba(227,179,65,.14);
  --scrim:rgba(0,0,0,.6); --shadow:0 24px 70px rgba(0,0,0,.55);
  --inset:inset 0 2px 7px rgba(0,0,0,.55), inset 0 -1px 0 rgba(255,255,255,.05);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--ink);
  font-family:'Inter',-apple-system,'Helvetica Neue',Arial,sans-serif;
  font-size:15px; line-height:1.45;
  display:flex; align-items:center; justify-content:center;
  min-height:100vh; padding:28px 0;
  -webkit-font-smoothing:antialiased;
}
.display{font-family:'Inter Tight','Inter',-apple-system,sans-serif}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
img{display:block;max-width:100%}
.num{font-variant-numeric:tabular-nums}

/* ---------- phone frame ---------- */
.phone{
  position:relative; width:min(400px,100vw); height:min(852px,100vh);
  background:var(--phone); border-radius:44px; overflow:hidden;
  box-shadow:var(--shadow); border:1px solid var(--line);
}
@media (max-width:480px), (max-height:900px) and (max-width:480px){
  body{padding:0}
  .phone{width:100vw;height:100vh;height:100dvh;border-radius:0;border:none}
}
.statusbar{
  position:absolute;top:0;left:0;right:0;height:44px;z-index:60;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 26px;font-size:13px;font-weight:600;pointer-events:none;
}
.statusbar .cell{display:flex;gap:5px;align-items:center}
.statusbar svg{display:block}

/* ---------- screens ---------- */
.screen{
  position:absolute;inset:0;background:var(--phone);
  display:flex;flex-direction:column;
  opacity:0;transform:translateX(26px);pointer-events:none;
  transition:opacity .32s ease,transform .32s cubic-bezier(.32,.72,.28,1);
  z-index:1; overflow:hidden;
}
.screen.active{opacity:1;transform:none;pointer-events:auto;z-index:2}
.screen.back{transform:translateX(-18px)}
@media (prefers-reduced-motion:reduce){
  .screen,.sheet,.mode-pane,.toast{transition:none !important;animation:none !important}
}
.scroller{flex:1;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none}
.scroller::-webkit-scrollbar{display:none}

.apphead{
  padding:56px 20px 10px;display:flex;align-items:center;justify-content:space-between;gap:10px;
}
.apphead h1{font-size:22px;font-weight:700;letter-spacing:-.02em}
.iconbtn{
  width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:var(--surface);border:1px solid var(--line);color:var(--ink);
  transition:transform .15s ease;
}
.iconbtn:active{transform:scale(.92)}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

/* ---------- tab bar ---------- */
/* impeccable: invisible touch-target expansion — visuals unchanged, hit areas ≥40px */
.mplay,.skip,.xtoggle,.morebtn,.goto,.sbtn,.pplay,.sw,#houserules .hsw,.socialrow button,.uname,.orbav.pavdock,.stgfollow,.fchk{position:relative}
.mplay::after{content:"";position:absolute;inset:-12px -6px}
.skip::after,.xtoggle::after{content:"";position:absolute;inset:-10px}
.morebtn::after{content:"";position:absolute;inset:-11px}
.goto::after{content:"";position:absolute;inset:-8px -6px}
.sbtn::after{content:"";position:absolute;inset:-8px -4px}
.pplay::after,.sw::after,#houserules .hsw::after{content:"";position:absolute;inset:-7px}
.socialrow button::after{content:"";position:absolute;inset:-10px -4px}
.uname::after{content:"";position:absolute;inset:-6px -4px}
.orbav.pavdock::after{content:"";position:absolute;inset:-9px}
.stgfollow::after{content:"";position:absolute;inset:-8px}
.fchk::after{content:"";position:absolute;inset:-8px 0}
#uxnote{position:fixed;left:0;right:0;bottom:calc(2px + env(safe-area-inset-bottom,0px));z-index:400;text-align:center;pointer-events:none;font-size:8.5px;font-weight:600;letter-spacing:.04em;color:rgba(136,134,126,.92)}
#uxnote b{color:#E8420F;font-weight:800}
.tabbar{
  position:relative;z-index:5;display:flex;border-top:1px solid var(--line);
  background:var(--phone);padding:8px 8px calc(14px + env(safe-area-inset-bottom,0px));
}
.tabbar button{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:10px;font-weight:600;color:var(--muted);padding:4px 0;letter-spacing:.02em;
}
.tabbar button.on{color:var(--ink)}
.tabbar button.on .dotm{opacity:1}
.tabbar svg{width:22px;height:22px}
.tabbar .taborb{width:22px;height:22px;flex:0 0 auto}
.dotm{width:4px;height:4px;border-radius:50%;background:var(--accent);opacity:0;margin-top:1px}

/* the vertical dial: tuning shares the scroll axis. On the surf it stacks stations; in a broadcast it maps blocks. */
/* THE DIAL — a physical tuner band.
   A tick rail runs the left margin with the red needle fixed at its centre; the station band
   moves under it. Nothing is masked (masking clipped the avatars) — rows fade by distance. */
.vdial{position:absolute;left:12px;bottom:252px;z-index:6;width:216px;height:198px;touch-action:none;cursor:grab}
.vdial:active{cursor:grabbing}
/* the rail: fine ticks, brighter majors, faded at both ends — its own element, no avatars inside */
.vrail{position:absolute;left:0;top:0;bottom:0;width:15px;pointer-events:none;
  background:
    repeating-linear-gradient(180deg, rgba(255,255,255,.95) 0 2px, transparent 2px 42px),
    repeating-linear-gradient(180deg, rgba(255,255,255,.5) 0 1.5px, transparent 1.5px 10.5px);
  background-size:15px 42px, 8px 10.5px;
  background-repeat:repeat-y, repeat-y;
  background-position:0 0, 0 0;
  -webkit-mask-image:linear-gradient(180deg,transparent,#000 26%,#000 74%,transparent);
  mask-image:linear-gradient(180deg,transparent,#000 26%,#000 74%,transparent);
  opacity:.5;transition:opacity .35s ease;
  filter:drop-shadow(0 1px 2px rgba(0,0,0,.45))}
.vdial.dialing .vrail{opacity:.95}
/* the needle is fixed at the rail's centre and points into the tuned station */
.tneedle{position:absolute;left:0;top:50%;margin-top:-1.5px;width:30px;height:3px;border-radius:2px;pointer-events:none;z-index:4;
  background:linear-gradient(90deg,rgba(255,59,72,1) 0 52%,rgba(255,59,72,0));
  box-shadow:0 0 7px rgba(255,59,72,.9),0 0 18px rgba(214,64,182,.45)}
.tband{position:absolute;left:0;top:0;width:100%;height:100%}
.drow{position:absolute;left:26px;width:calc(100% - 26px);height:42px;margin-top:-21px;display:flex;align-items:center;gap:9px;cursor:pointer;z-index:1;
  transition:top .42s cubic-bezier(.22,.9,.28,1),opacity .3s ease}
.tband.drag .drow{transition:opacity .2s ease}
.drow .dav{position:relative;width:28px;height:28px;border-radius:50%;flex:0 0 auto;
  transform-origin:left center;transition:transform .42s cubic-bezier(.22,.9,.28,1)}
.drow .dav img{width:100%;height:100%;object-fit:cover;border-radius:50%;border:1.5px solid rgba(255,255,255,.8);box-shadow:0 3px 10px rgba(0,0,0,.45)}
.drow .dnm{font-size:10.5px;font-weight:700;letter-spacing:.02em;color:#fff;background:rgba(0,0,0,.46);backdrop-filter:blur(8px);padding:3px 10px;border-radius:99px;white-space:nowrap;opacity:0;transform:translateX(-7px);transition:opacity .22s,transform .22s;margin-left:20px}
.vdial.dialing .drow .dnm,.drow:hover .dnm{opacity:.85;transform:none}
.drow.on{z-index:3}
.drow.on .dav{transform:scale(1.62)}
.drow.on .dav img{border:2.5px solid rgba(255,255,255,.96)}
.drow.on.lvon .dav img{box-shadow:0 4px 14px rgba(0,0,0,.5),0 0 0 2.5px var(--live),0 0 12px rgba(107,233,149,.75)}
.drow.on .dnm{opacity:1 !important;transform:none;font-size:12.5px;padding:5px 12px;background:rgba(0,0,0,.55);margin-left:36px}
.drow .lvt{color:var(--live);font-weight:800}
.drow .lv{position:absolute;bottom:-1px;right:-1px;width:10px;height:10px;border-radius:50%;background:var(--live);border:2px solid rgba(255,255,255,.95)}
@media (prefers-reduced-motion:reduce){.drow,.drow .dav{transition:none}}
@keyframes bloop{0%{transform:scale(.2)}58%{transform:scale(1.16)}82%{transform:scale(.95)}100%{transform:scale(1)}}
.segcard[data-bn]::before{content:attr(data-bn);display:block;font-size:9px;font-weight:800;letter-spacing:.13em;color:var(--muted);margin:0 0 6px;font-variant-numeric:tabular-nums}
.surfinfo h3 .lchip{font-size:11.5px;font-weight:700;letter-spacing:.02em;background:rgba(0,0,0,.38);backdrop-filter:blur(8px);padding:4px 11px;border-radius:99px;color:rgba(255,255,255,.92);margin-left:2px}
.vdial2{position:absolute;right:8px;top:6px;bottom:96px;z-index:9;display:flex;flex-direction:column;justify-content:center;gap:11px;align-items:center}
.vdial2::before{content:"";position:absolute;top:0;bottom:0;left:50%;width:12px;transform:translateX(-50%);background:repeating-linear-gradient(180deg,var(--line) 0 1px,transparent 1px 7px);border-radius:2px;pointer-events:none}
.sgm{width:26px;height:26px;border-radius:50%;overflow:hidden;border:2px solid var(--phone);box-shadow:0 3px 10px rgba(0,0,0,.2);position:relative;background:var(--surface);opacity:.55;transform:scale(.92);transition:transform .35s cubic-bezier(.34,1.56,.64,1),opacity .3s,box-shadow .3s}
.sgm img{width:100%;height:100%;object-fit:cover}
.sgm.focus{transform:scale(1.35);opacity:1;box-shadow:0 5px 14px rgba(0,0,0,.3),0 0 0 2px var(--live)}
@media (prefers-reduced-motion:reduce){.drow .dav{animation:none}.sgm{transition:opacity .3s}}
/* the surf: home is the dial — swipe to change stations */
.surf{flex:1;min-height:0;overflow-y:auto;scroll-snap-type:y mandatory;overscroll-behavior:contain;scrollbar-width:none}
.surf::-webkit-scrollbar{display:none}
.surfcard{height:100%;min-height:100%;scroll-snap-align:start;scroll-snap-stop:always;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end}
.surfcard .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.surfcard .veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.2),transparent 32%,rgba(0,0,0,.55) 66%,rgba(0,0,0,.85))}
.surfinfo{position:relative;padding:0 20px 16px;color:#fff;display:flex;flex-direction:column;gap:7px}
.surfinfo .toprow{display:flex;gap:8px;align-items:center}
.surfinfo h3{font-size:27px;font-weight:800;letter-spacing:-.03em;display:flex;gap:9px;align-items:center;text-shadow:0 2px 14px rgba(0,0,0,.4)}
.surfinfo .hostline{font-size:13px;color:rgba(255,255,255,.8)}
.surfbtns{display:flex;gap:9px;margin-top:7px}
.surfbtns .btn.primary{background:#F5F4F0;color:#111110;flex:1;padding:13px 20px}
.surfbtns .btn.ghost{border-color:rgba(255,255,255,.32);background:rgba(255,255,255,.13);color:#fff;backdrop-filter:blur(8px);padding:13px 18px}
.surfbtns .btn.ghost.followed{background:rgba(255,255,255,.92);color:#111110;border-color:transparent}
.surfhint{font-size:10.5px;font-weight:600;letter-spacing:.06em;color:rgba(255,255,255,.55);text-align:center;margin-top:4px}
/* discover */
.searchrow{display:flex;align-items:center;gap:10px;margin:6px 20px 4px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 15px;font-size:14px;color:var(--muted);cursor:pointer}
.genrerow{display:flex;gap:8px;overflow-x:auto;padding:10px 20px 2px;scrollbar-width:none}
.genrerow::-webkit-scrollbar{display:none}
.genrerow .tchip{flex:0 0 auto;padding:8px 15px;font-size:13px}
.discgrid{display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:124px;gap:10px;padding:10px 20px 4px}
/* universal menu */
/* the account button: your own face is the way in, not a hamburger */
/* your account: heavier than a nav icon, and the gear says plainly that settings live here */
.avbtn{width:40px;height:40px;border-radius:50%;padding:0;border:2.5px solid var(--ink);background:var(--surface2);position:relative;flex:0 0 auto;overflow:visible;
  box-shadow:0 2px 8px rgba(17,17,16,.18);transition:transform .15s ease}
.avbtn:active{transform:scale(.94)}
.avbtn img{width:100%;height:100%;object-fit:cover;display:block;border-radius:50%}
.avbtn .gearb{position:absolute;right:-4px;bottom:-4px;width:17px;height:17px;border-radius:50%;background:var(--ink);color:var(--phone);
  border:2px solid var(--bg);display:flex;align-items:center;justify-content:center}
.avbtn .gearb svg{width:9px;height:9px}
.avbtn .dotm{position:absolute;right:-2px;top:-2px;width:10px;height:10px;border-radius:50%;background:var(--accent);border:2px solid var(--bg)}
/* account takeover */
#scr-acct .idcard{display:flex;align-items:center;gap:13px;padding:16px;border-radius:18px;border:1px solid var(--line);background:var(--surface);margin-bottom:12px}
#scr-acct .idcard .av{width:58px;height:58px;border-radius:50%;overflow:hidden;flex:0 0 auto;border:2px solid var(--line)}
#scr-acct .idcard .av img{width:100%;height:100%;object-fit:cover}
#scr-acct .idcard .who{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
#scr-acct .idcard .who b{font-size:15px;letter-spacing:-.02em;display:flex;align-items:center;gap:6px;min-width:0}
.who b>:first-child{overflow:hidden;text-overflow:ellipsis}
.who .wtitle{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#scr-acct .idcard .who span{font-size:11.5px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acc{border:1px solid var(--line);border-radius:16px;background:var(--surface);margin-bottom:9px;overflow:hidden}
.acc>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:11px;padding:14px 15px;font-size:14.5px;font-weight:700;letter-spacing:-.01em}
.acc>summary::-webkit-details-marker{display:none}
.acc>summary .ai{width:26px;height:26px;border-radius:8px;background:var(--surface2);display:flex;align-items:center;justify-content:center;color:var(--muted);flex:0 0 auto}
.acc>summary .av2{margin-left:auto;font-size:12px;color:var(--muted);font-weight:600}
.acc>summary .chev{width:14px;height:14px;color:var(--muted);transition:transform .22s ease;flex:0 0 auto}
.acc[open]>summary .chev{transform:rotate(180deg)}
.accbody{padding:2px 15px 14px;display:flex;flex-direction:column;gap:2px}
.srow{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line);font-size:13.5px}
.srow:first-child{border-top:0}
.srow .sk{color:var(--muted);font-size:12.5px}
.srow .sv{margin-left:auto;font-weight:600;font-size:13px;text-align:right}
.srow p{font-size:11.5px;color:var(--muted);margin:2px 0 0;line-height:1.45}
.srow .stx{flex:1;min-width:0;display:flex;flex-direction:column}
.srow .stx b{font-size:13.5px;font-weight:600;letter-spacing:-.005em}
.sw{width:42px;height:25px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);position:relative;flex:0 0 auto;transition:background .2s,border-color .2s;cursor:pointer;padding:0}
.sw i{position:absolute;top:2px;left:2px;width:19px;height:19px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.sw.on{background:var(--live);border-color:var(--live)}
.sw.on i{transform:translateX(17px)}
#houserules .hrlock{border:1px solid var(--line);background:var(--surface2);border-radius:12px;padding:9px 11px;margin:10px 0 2px;display:flex;gap:8px;align-items:flex-start;color:var(--muted)}
#houserules .hrlock b{font-size:12px;font-weight:700;color:var(--ink)}
#houserules .hrlock p{font-size:11px;margin:2px 0 0;line-height:1.45}
#houserules .hrl{cursor:pointer}
#houserules .hrad{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line);flex:0 0 auto;position:relative}
#houserules .hrl.sel .hrad{border-color:var(--live)}
#houserules .hrl.sel .hrad::after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--live)}
#houserules .hsw{width:42px;height:25px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);position:relative;flex:0 0 auto;transition:background .2s,border-color .2s;cursor:pointer;padding:0}
#houserules .hsw i{position:absolute;top:2px;left:2px;width:19px;height:19px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
#houserules .hsw.on{background:var(--live);border-color:var(--live)}
#houserules .hsw.on i{transform:translateX(17px)}
#houserules details{border-top:1px solid var(--line);margin-top:-1px}
#houserules summary{list-style:none;display:flex;align-items:center;gap:7px;padding:11px 0;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted)}
#houserules summary::-webkit-details-marker{display:none}
#houserules .hrchev{transition:transform .2s}
#houserules details[open] .hrchev{transform:rotate(180deg)}
#houserules details .srow{border-top:1px solid var(--line);margin-left:8px}

.sbtn{margin-left:auto;font-size:12px;font-weight:700;color:var(--accent);background:none;border:0;padding:6px 0}
.planchip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;background:var(--gold-soft);color:var(--gold);font-size:10px;font-weight:800;letter-spacing:.06em}
.menurow{display:flex;align-items:center;gap:13px;padding:14px 4px;border-bottom:1px solid var(--line);font-size:14.5px;font-weight:600;width:100%;text-align:left}
.menurow:last-child{border-bottom:none}
.menurow .msub{margin-left:auto;font-size:12px;color:var(--muted);font-weight:600;text-align:right}
.menurow.nav::after{content:"";width:13px;height:13px;flex:0 0 auto;background:var(--muted);-webkit-mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'><path d='M9 6l6 6-6 6'/></svg>") center/contain no-repeat;mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'><path d='M9 6l6 6-6 6'/></svg>") center/contain no-repeat}
.menurow.nav .msub{margin-left:auto}
#sheet-agentcfg .replist button{position:relative;padding-right:26px}

/* ---------- shared cards ---------- */

.bornnote{position:absolute;left:24px;right:24px;top:15%;z-index:97;background:rgba(248,247,243,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(0,0,0,.08);border-radius:20px;padding:16px 18px 15px;box-shadow:0 18px 50px rgba(0,0,0,.35);display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;color:#161514;cursor:pointer;opacity:0;transform:translateY(12px) scale(.97);animation:bornnoteIn .6s cubic-bezier(.2,.8,.3,1) forwards}

/* the thread: comets arcing from the dial to the agent tab — born of one another */

@keyframes bcY{0%{transform:translateY(0)}46%{transform:translateY(calc(var(--dy)*.46 + var(--arc)))}100%{transform:translateY(var(--dy))}}

.uhead{display:flex;flex-direction:column;align-items:center;text-align:center;margin-top:-44px;position:relative;padding:0 20px}
.uhead .pav{width:86px;height:86px;border-radius:50%;overflow:hidden;border:3px solid var(--phone);box-shadow:0 8px 24px rgba(0,0,0,.2)}
.uhead .pav img{width:100%;height:100%;object-fit:cover}
.uhead h2{font-size:20px;font-weight:800;letter-spacing:-.02em;margin-top:8px}
.uhead .hand{font-size:13px;color:var(--muted)}
.uhead .bio{font-size:13px;color:var(--muted);max-width:34ch;margin-top:6px}
/* the content spectrum: canon video → social video → raw notes → carousels */
.mvwrap{position:relative;border-radius:14px;overflow:hidden;background:#000}
.mvwrap video{width:100%;display:block;object-fit:cover;aspect-ratio:4/5}
.ytbadge{position:absolute;left:10px;bottom:10px;display:flex;align-items:center;gap:6px;font-size:9.5px;font-weight:800;letter-spacing:.05em;color:#fff;background:rgba(0,0,0,.62);backdrop-filter:blur(8px);padding:5px 11px 5px 8px;border-radius:999px}
.mvchip{position:absolute;top:10px;left:10px;font-size:9.5px;font-weight:800;letter-spacing:.08em;color:#fff;background:rgba(0,0,0,.5);backdrop-filter:blur(8px);padding:5px 10px;border-radius:999px}
.mvdur{position:absolute;bottom:10px;right:10px;font-size:10.5px;font-weight:700;color:#fff;background:rgba(0,0,0,.55);padding:3px 8px;border-radius:7px}
.notewrap{display:flex;align-items:center;gap:12px;background:var(--gold-soft);border:1px dashed var(--gold);border-radius:16px;padding:13px}
.noteplay{width:46px;height:46px;border-radius:50%;background:var(--gold);color:#fff;display:flex;align-items:center;justify-content:center;flex:0 0 auto;transition:transform .15s}
.noteplay:active{transform:scale(.9)}
.notewrap .nm3{flex:1;min-width:0}
.notewrap .nm3 b{display:block;font-size:12.5px;font-weight:800;color:var(--gold)}
.notewrap .nm3 span{font-size:11px;color:var(--muted)}
.caro{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;border-radius:14px}
.caro::-webkit-scrollbar{display:none}
.caro img{width:72%;flex:0 0 auto;aspect-ratio:4/5;object-fit:cover;border-radius:12px;scroll-snap-align:start}
/* end of tonight's blocks — the dial never stops. Auto-continues into an agent mix
   unless you pick another station first; lean-back listening is the default. */
.keepgoing{padding:20px 16px 18px;display:flex;flex-direction:column;gap:12px}
.keepgoing .kgeyebrow{font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);font-weight:800}
.keepgoing h4{font-size:19px;font-weight:800;letter-spacing:-.02em;margin:0}
.keepgoing .kgsub{font-size:13px;color:var(--muted);line-height:1.5;max-width:38ch}
.nextup{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;border:1px solid var(--line);background:var(--surface)}
.nextup .art{width:52px;height:52px;border-radius:12px;overflow:hidden;flex:0 0 auto;position:relative}
.nextup .art img{width:100%;height:100%;object-fit:cover}
.nextup .meta{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.nextup .meta b{font-size:14px;letter-spacing:-.01em}
.nextup .meta span{font-size:11.5px;color:var(--muted)}
.kgring{width:40px;height:40px;flex:0 0 auto;position:relative;display:flex;align-items:center;justify-content:center}
.kgring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.kgring .bg{stroke:var(--line)}
.kgring .fg{stroke:var(--live);stroke-linecap:round;transition:stroke-dashoffset .95s linear}
.kgring b{font-size:13px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--ink)}
.kgnow{width:40px;height:40px;border-radius:50%;background:var(--ink);color:var(--phone);display:flex;align-items:center;justify-content:center;flex:0 0 auto;border:0}
.kgrow{display:flex;gap:8px;align-items:center}
.chanrail{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding:2px 0 4px;margin:0 -16px;padding-left:16px;padding-right:16px}
.chanrail::-webkit-scrollbar{display:none}
.chancard{flex:0 0 auto;width:124px;border:0;background:none;padding:0;text-align:left;display:flex;flex-direction:column;gap:6px}
.chancard .ca{width:124px;height:88px;border-radius:14px;overflow:hidden;position:relative;border:1px solid var(--line)}
.chancard .ca img{width:100%;height:100%;object-fit:cover}
.chancard .cl{position:absolute;left:6px;top:6px;padding:2px 7px;border-radius:99px;background:var(--live);color:var(--on-live);font-size:9px;font-weight:800;letter-spacing:.05em}
.chancard b{font-size:12px;letter-spacing:-.01em;line-height:1.25}
.chancard span{font-size:10.5px;color:var(--muted)}
.mediastrip{display:flex;gap:7px}
.mediastrip .ms{position:relative;flex:1;aspect-ratio:4/5;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.mediastrip .ms img,.mediastrip .ms video{width:100%;height:100%;object-fit:cover}
.mediastrip .ms i{position:absolute;left:5px;bottom:5px;font-style:normal;font-size:8.5px;font-weight:800;letter-spacing:.05em;color:#fff;background:rgba(0,0,0,.5);padding:2px 6px;border-radius:6px;backdrop-filter:blur(6px);white-space:nowrap}
.now-art .onair{position:absolute;top:12px;left:12px}
.now-meta{text-align:center;margin-top:16px;width:100%}
.now-meta .seg-kind{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.now-meta h3{font-size:21px;font-weight:800;letter-spacing:-.025em;margin-top:4px;text-wrap:balance}
.now-meta p{font-size:13px;color:var(--muted);margin-top:2px}
.rightsrow{display:flex;justify-content:center;margin-top:9px;min-height:26px}
#wave{width:100%;height:52px;margin-top:8px;flex:0 0 auto}
.caption{
  min-height:44px;max-height:104px;overflow:hidden;
  display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px;text-align:center;
  font-size:14.5px;font-weight:500;color:var(--ink);padding:0 8px;line-height:1.35;
  -webkit-mask-image:linear-gradient(180deg,transparent,#000 30%);mask-image:linear-gradient(180deg,transparent,#000 30%);
}
.caption .kpast{opacity:.5;font-size:13px}
.caption .kpast .mention{pointer-events:auto}
.caption em{font-style:normal;color:var(--muted)}
.transport{display:flex;align-items:center;gap:26px;margin-top:4px}
.transport .pp{
  width:64px;height:64px;border-radius:50%;background:var(--ink);color:var(--phone);
  display:flex;align-items:center;justify-content:center;box-shadow:0 12px 30px rgba(0,0,0,.22);
  transition:transform .15s ease;
}
.transport .pp:active{transform:scale(.92)}
.transport .skip{color:var(--muted)}
.actionrow{
  display:flex;justify-content:center;gap:8px;margin:14px 0 12px;width:100%;
}
.act{
  display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10.5px;font-weight:600;color:var(--muted);
  padding:8px 10px;border-radius:14px;min-width:64px;transition:transform .12s;
}
.act:active{transform:scale(.9)}
.act .bub{width:44px;height:44px;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--ink);transition:all .18s}
.act.liked .bub{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.act.liked{color:var(--accent)}
.act.certed .bub{background:var(--gold-soft);border-color:var(--gold);color:var(--gold)}
.act.certed{color:var(--gold)}
.act.talk .bub{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.act[disabled]{opacity:.35;pointer-events:none}
/* Remix wakes up when the playing track is remix-cleared */
@keyframes remixglow{
  0%,100%{box-shadow:0 0 0 0 rgba(255,75,31,.45)}
  50%{box-shadow:0 0 0 13px rgba(255,75,31,0)}
}
@keyframes remixblink{0%,100%{opacity:1}50%{opacity:.55}}
.act.remixready .bub{background:var(--accent);border-color:var(--accent);color:var(--on-accent);animation:remixglow 1.5s ease-out infinite}
.act.remixready{color:var(--accent)}
@media (prefers-reduced-motion:reduce){.act.remixready .bub{animation:none}}
.refsrow{display:flex;gap:8px;align-items:stretch;margin:10px 0 4px;flex-wrap:wrap}
.refthumb{position:relative;width:74px;height:74px;border-radius:12px;overflow:hidden;border:1.5px solid var(--line);flex:0 0 auto}
.refthumb img{width:100%;height:100%;object-fit:cover;display:block}
.refthumb i{position:absolute;left:0;right:0;bottom:0;font-style:normal;font-size:7.5px;font-weight:800;letter-spacing:.06em;color:#fff;background:rgba(0,0,0,.55);padding:3px 5px;text-align:center}
.refthumb.locked{border-color:var(--accent)}
.refadd{width:74px;height:74px;border-radius:12px;border:1.5px dashed var(--line);background:var(--surface2);color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:9.5px;font-weight:800;flex:0 0 auto;cursor:pointer}
.remixinrow{display:flex;gap:9px;margin-top:14px;align-items:stretch}
.remixinrow .remixfield{flex:1;margin-top:0}
.remixmic{
  width:52px;border-radius:16px;background:var(--accent);color:var(--on-accent);
  display:flex;align-items:center;justify-content:center;flex:0 0 auto;transition:transform .15s;position:relative;
}
.remixmic:active{transform:scale(.94)}
.remixmic.rec::before{content:"";position:absolute;inset:-6px;border-radius:20px;border:2px solid var(--accent);animation:ring 1.1s infinite}
.remixacts{display:flex;flex-direction:column;gap:9px}
.remixacts .rrow{display:flex;gap:9px}
.remixacts .rrow .btn{flex:1}
.progate{
  border:1px solid var(--gold);background:var(--gold-soft);border-radius:14px;padding:12px 14px;
  display:none;flex-direction:column;gap:8px;font-size:12.5px;line-height:1.45;
}
.progate.show{display:flex}
.progate b{font-size:13px}
.progate .ok{color:var(--live);font-weight:700}

/* scroll pane */
#pane-scroll{position:absolute;inset:96px 0 0 0}
#pane-scroll .scroller{padding:4px 16px 86px;display:flex;flex-direction:column;gap:10px;min-height:0}
.nowbar{
  position:absolute;left:12px;right:12px;bottom:12px;z-index:8;
  display:flex;align-items:center;gap:11px;padding:9px 12px;
  background:var(--surface);border:1px solid var(--line);border-radius:18px;
  box-shadow:0 12px 34px rgba(0,0,0,.18);
}
.nowbar .na{width:38px;height:38px;border-radius:10px;overflow:hidden;flex:0 0 auto}
.nowbar .na img{width:100%;height:100%;object-fit:cover}
.nowbar .nm2{flex:1;min-width:0}
.nowbar .nm2 b{display:block;font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nowbar .nm2 span{font-size:10.5px;color:var(--muted)}
.nowbar .pp2{width:38px;height:38px;border-radius:50%;background:var(--ink);color:var(--phone);display:flex;align-items:center;justify-content:center;flex:0 0 auto;transition:transform .15s}
.nowbar .pp2:active{transform:scale(.9)}
.segcard{padding:14px;display:flex;flex-direction:column;gap:10px;position:relative;transition:border-color .3s, box-shadow .3s}
/* connected-source grammar: anything piped in via API/MCP is SQUARE and RECESSED; native blocks stay rounded */
.segcard.ext{border-radius:0;background:var(--surface2);box-shadow:var(--inset)}
.segcard.ext .mvwrap,.segcard.ext .caro,.segcard.ext .caro img,.segcard.ext .trackline{border-radius:0}
.srcbar{display:flex;align-items:center;gap:7px;font-size:9px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.srcbar .srcend{margin-left:auto;letter-spacing:.1em}
.srcbar i{width:6px;height:6px;font-style:normal;flex:0 0 auto;background:var(--muted)}
.srcbar svg{opacity:.9}
.chip.brk{background:#E5484D;color:#fff}
.chip.brk .pdot{width:5px;height:5px;border-radius:50%;background:currentColor;animation:pulse 1.1s infinite}
.newsav{width:38px;height:38px;background:#E5484D;display:flex;align-items:center;justify-content:center;color:#fff;flex:0 0 auto}
.segcard.nowplaying{border-color:var(--live);box-shadow:0 0 0 3px var(--live-soft)}
.segcard.nowplaying [data-segbtn]{background:var(--live);color:var(--on-live)}
.segtop{display:flex;align-items:center;gap:8px}
.segtop .av{width:38px;height:38px;border-radius:50%;overflow:hidden;flex:0 0 auto;background:var(--surface2)}
.segtop .av img{width:100%;height:100%;object-fit:cover}
.segtop .who{flex:1;min-width:0}
.segtop .who b{font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:5px}
.segtop .who span{font-size:11.5px;color:var(--muted)}
.xtoggle{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--muted);flex:0 0 auto;transition:transform .3s ease}
.segcard.open .xtoggle{transform:rotate(180deg)}
.xbody{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s ease}
.segcard.open .xbody{grid-template-rows:1fr}
.xbody>div{min-height:0;overflow:hidden}
.xin{display:flex;flex-direction:column;gap:9px;padding-top:12px;border-top:1px dashed var(--line);font-size:13px;line-height:1.45}
.xin .xw{font-size:10px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--accent);display:block;margin-bottom:2px}
.xin .xm{background:var(--surface2);border-radius:12px;padding:9px 12px}
.segbody{font-size:14px;line-height:1.45}
.segbody.quote{color:var(--ink)}
.trackline{display:flex;align-items:center;gap:11px;background:var(--surface2);border-radius:14px;padding:10px}
.trackline .ta{width:44px;height:44px;border-radius:10px;overflow:hidden;flex:0 0 auto}
.trackline .ta img{width:100%;height:100%;object-fit:cover}
.trackline .tm{flex:1;min-width:0}
.trackline .tm b{display:block;font-size:13.5px;font-weight:700}
.trackline .tm span{font-size:11.5px;color:var(--muted)}
.socialrow{display:flex;align-items:center;gap:16px;font-size:12px;color:var(--muted);font-weight:600}
.socialrow button{display:flex;align-items:center;gap:5px;color:inherit;font-weight:600;font-size:12px;transition:transform .12s}
.socialrow button:active{transform:scale(.88)}
.socialrow button.liked{color:var(--accent)}
.socialrow button.certed{color:var(--gold)}
@keyframes bloom{0%{transform:scale(1)}40%{transform:scale(1.28)}100%{transform:scale(1)}}
.redrow{display:flex;align-items:center;gap:12px;padding:13px 2px;border-bottom:1px solid var(--line)}
.redrow:last-child{border-bottom:none}
.redrow .ri{color:var(--accent);flex:0 0 auto;display:flex}
.redrow .rm{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.redrow .rm b{font-size:13.5px}
.redrow .rm span{font-size:11.5px;color:var(--muted);line-height:1.45}
.redrow .tchip{flex:0 0 auto}
.redrow .tchip.notyet{opacity:.45}
.stchip{margin-left:auto;font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:4px 9px;border-radius:99px;flex:0 0 auto}
.stchip.open{background:var(--live-soft);color:var(--live)}
.stchip.soon{background:var(--surface2);color:var(--muted)}
.recip .rhead{display:flex;align-items:baseline;gap:8px;margin-bottom:9px}
.recip .rhead b{font-size:13.5px;letter-spacing:-.01em}
.recip .rhead span{font-size:11px;color:var(--muted);margin-left:auto}
.rbars{display:flex;flex-direction:column;gap:7px}
.rb{display:flex;align-items:center;gap:9px;font-size:12px}
.rb .rl{width:58px;color:var(--muted);font-weight:600}
.rb .rt{flex:1;height:7px;border-radius:99px;background:var(--surface2);overflow:hidden}
.rb .rt i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.rb .rt.giv i{background:var(--live)}
.rb b{width:34px;text-align:right;font-size:12.5px}
.rnote{font-size:11.5px;color:var(--muted);line-height:1.5;margin:10px 0 9px}
.rnote b{color:var(--ink)}
.stnote{font-size:11.5px;color:var(--muted);line-height:1.5;margin:2px 0 10px}
.flgrp{margin-bottom:10px}
.fllab{font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);font-weight:800;margin:0 0 5px}
.flrow{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--line)}
.flrow:first-of-type{border-top:0}
.fli{width:30px;height:30px;border-radius:9px;overflow:hidden;flex:0 0 auto}
.fli img{width:100%;height:100%;object-fit:cover}
.flm{flex:1;min-width:0;display:flex;flex-direction:column}
.flm b{font-size:13px;letter-spacing:-.01em}
.flm span{font-size:11px;color:var(--muted)}
.flnum{color:var(--accent);font-size:13.5px;font-weight:800;flex:0 0 auto}
.flrec{display:flex;gap:9px;align-items:flex-start;font-size:11.5px;line-height:1.5;color:var(--muted);background:var(--accent-soft);padding:11px 12px;border-radius:12px;margin:4px 0 11px}
.flrec b{color:var(--ink)}
.flowernote{font-size:12px;color:var(--muted);line-height:1.55;margin-top:14px;padding:0 2px}
.vnew{display:flex;align-items:center;gap:8px;width:100%;padding:13px 2px 4px;font-size:13.5px;font-weight:700;color:var(--accent);border-top:1px solid var(--line);margin-top:4px}
.vmaker{display:flex;flex-direction:column;gap:10px;padding:12px 2px 4px;border-top:1px solid var(--line);margin-top:4px}
.vinput{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:11px 14px;font-size:12.5px;color:var(--muted)}
.vchips{display:flex;gap:7px;flex-wrap:wrap}
.minibar{display:flex;align-items:center;gap:8px}
.minibar .mplay{width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--phone);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.minibar .bars{display:flex;gap:2.5px;align-items:center;height:20px}
.minibar .bars i{width:2.5px;background:var(--muted);border-radius:2px;height:30%}
.pollopt{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13.5px;font-weight:600;position:relative;overflow:hidden;transition:border-color .2s}
.pollopt .fillb{position:absolute;inset:0;background:var(--accent-soft);width:0;transition:width .5s ease;border-radius:12px}
.pollopt span{position:relative}
.pollopt .pct{margin-left:auto;position:relative;color:var(--muted);font-size:12px;opacity:0;transition:opacity .3s}
.pollopt.voted{border-color:var(--accent)}
.pollopt.revealed .pct{opacity:1}

/* ---------- sheets ---------- */
.sheetveil{position:absolute;inset:0;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .28s;z-index:40}
.sheetveil.show{opacity:1;pointer-events:auto}
.sheet{
  position:absolute;left:0;right:0;bottom:0;z-index:50;background:var(--phone);
  border-radius:26px 26px 0 0;padding:14px 20px calc(24px + env(safe-area-inset-bottom,0px));
  transform:translateY(105%);transition:transform .34s cubic-bezier(.32,.72,.28,1);
  max-height:78%;display:flex;flex-direction:column;border-top:1px solid var(--line);
}
.sheet.show{transform:none}
.grab{width:38px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 14px;flex:0 0 auto}
.sheet h3{font-size:18px;font-weight:800;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.sheet .sub{font-size:13px;color:var(--muted);margin-top:3px}
.convo{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:16px 2px;min-height:120px;scrollbar-width:none}
.msg{max-width:82%;padding:10px 14px;border-radius:18px;font-size:14px;line-height:1.45;opacity:0;transform:translateY(8px);animation:msgin .3s forwards}
@keyframes msgin{to{opacity:1;transform:none}}
.msg.you{align-self:flex-end;background:var(--ink);color:var(--phone);border-bottom-right-radius:6px}
.msg.dj{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:6px}
.msg.dj .tag{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);display:block;margin-bottom:3px}
.sysnote{
  align-self:center;display:inline-flex;align-items:center;gap:7px;background:var(--accent-soft);color:var(--accent);
  font-size:12px;font-weight:700;padding:7px 14px;border-radius:999px;opacity:0;animation:msgin .3s .1s forwards;
}
.microw{display:flex;align-items:center;gap:12px;padding-top:6px}
.micbtn{
  width:62px;height:62px;border-radius:50%;background:var(--accent);color:var(--on-accent);
  display:flex;align-items:center;justify-content:center;margin:0 auto;flex:0 0 auto;
  box-shadow:0 10px 28px rgba(255,75,31,.35);transition:transform .15s;position:relative;

@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .acct2 .an i{background:#4ADE80}}
.acct2 .how{font-size:10px;font-weight:700;letter-spacing:.05em;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:2px 6px}

.calrow:last-child{border-bottom:none}

.calrow .date b{display:block;font-size:16px;font-weight:800}
.calrow .date span{font-size:10px;color:var(--muted);text-transform:uppercase;font-weight:700;letter-spacing:.06em}

/* toast */
.toast{

  background:rgba(17,17,16,.9);backdrop-filter:blur(8px);color:var(--phone);font-size:11.5px;font-weight:600;
  padding:8px 15px;border-radius:99px;opacity:0;pointer-events:none;transition:all .28s ease;
  max-width:76%;text-align:center;line-height:1.45;box-shadow:0 8px 22px rgba(0,0,0,.22);
}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ===== Bond creation overrides ===== */
body{padding:0;min-height:0;display:block;background:#0C0C0B}
.phone{width:100vw;height:100vh;border-radius:0;border:none;box-shadow:none;transform-origin:0 0}
.taste-wrap,.lineup-wrap{padding-top:var(--topin,104px)}
.dial-wrap{position:relative;z-index:2;flex:1;display:flex;flex-direction:column;padding:var(--topin,104px) 22px 22px;color:#F5F4F0}
#scr-dial{background:radial-gradient(130% 95% at 50% 30%,#1B1917 0%,#0C0C0B 64%)}
.dial-wrap .eyebrow{color:rgba(245,241,236,.5)}
.dial-wrap h2{font-size:34px;font-weight:800;letter-spacing:-.035em;margin:6px 0 2px}
.dial-wrap .sub{color:rgba(245,241,236,.55);font-size:13.5px;margin-bottom:18px}
.dband{position:relative;flex:1;min-height:0}
.dband .drail{position:absolute;left:20px;top:6px;bottom:6px;width:2px;background:linear-gradient(180deg,transparent,rgba(245,241,236,.25) 12%,rgba(245,241,236,.25) 88%,transparent)}
.dneedle{position:absolute;left:8px;width:26px;height:3px;border-radius:2px;background:var(--accent);box-shadow:0 0 14px rgba(232,66,15,.7);transition:top .55s cubic-bezier(.3,.8,.3,1)}
.drow2{position:absolute;left:44px;right:0;display:flex;align-items:center;gap:12px;height:52px;opacity:0;transform:translateX(18px);animation:drIn .5s cubic-bezier(.2,.8,.3,1) forwards;text-align:left;color:inherit}
@keyframes drIn{to{opacity:1;transform:none}}
.drow2 .dav2{width:40px;height:40px;border-radius:50%;overflow:hidden;flex:none;position:relative;border:2px solid transparent;transition:border-color .3s,box-shadow .3s}
.drow2 .dav2 img{width:100%;height:100%;object-fit:cover}
.drow2 b{display:block;font-size:15px;font-weight:800;letter-spacing:-.015em}
.drow2 small{display:block;font-size:11.5px;color:rgba(245,241,236,.5);font-weight:600}
.drow2.on .dav2{border-color:var(--accent);box-shadow:0 0 16px rgba(232,66,15,.5)}
.drow2.on small{color:#FFB49A}
.drow2 .lv{margin-left:auto;font-size:10px;font-weight:800;letter-spacing:.14em;color:var(--live);display:flex;align-items:center;gap:5px}
.drow2 .lv i{width:6px;height:6px;border-radius:50%;background:var(--live);animation:lvp 1.4s ease-in-out infinite}
@keyframes lvp{50%{opacity:.35}}
.dial-wrap .again{align-self:center;margin-top:12px;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:rgba(245,241,236,.5)}
#birthname .bfield input{background:none;border:0;outline:0;color:inherit;font:inherit;text-align:center;width:180px}
#birthname .bdone{margin-top:4px;padding:9px 20px;border-radius:99px;background:#F5F4F0;color:#111;font-size:13px;font-weight:800;pointer-events:auto}
#birth.naming{cursor:default}
#birth.naming #birthskip{display:none}
#birth.naming #birthorb{pointer-events:auto}
/* gamified picks */
.meter{display:flex;align-items:center;gap:6px;margin:4px 0 10px}
.meter i{width:26px;height:6px;border-radius:3px;background:rgba(255,255,255,.16);transition:background .25s,box-shadow .25s,transform .25s}
.meter i.on{background:var(--accent);box-shadow:0 0 10px rgba(232,66,15,.6);transform:scaleY(1.3)}
.meter span{margin-left:6px;font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:rgba(245,241,236,.55)}
.meter.full span{color:var(--live)}
#scr-taste .taste-wrap .tchip{padding:12px 18px;font-size:15px;font-weight:700}
.lockbtn{opacity:.45;transition:opacity .25s,transform .25s}
.lockbtn.ready{opacity:1;animation:readyPop .5s cubic-bezier(.34,1.56,.64,1)}
@keyframes readyPop{40%{transform:scale(1.05)}}
.lockbtn.shake{animation:lockShake .4s}
@keyframes lockShake{25%{transform:translateX(-6px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
#scr-lineup{background:radial-gradient(130% 95% at 50% 30%,#1B1917 0%,#0C0C0B 64%)}
.lineup-wrap .eyebrow{color:rgba(245,241,236,.5)}
.artist{border:2px solid transparent;transition:transform .18s cubic-bezier(.34,1.56,.64,1),border-color .2s,box-shadow .2s}
.artist img{transition:filter .2s}
.artist:not(.on) img{filter:saturate(.55) brightness(.75)}
.artist.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent),0 0 18px rgba(232,66,15,.5)}
.artist.pop{transform:scale(.94)}
/* tap: a vintage radio-signal pulse */
.tapfx{position:fixed;left:0;top:0;width:0;height:0;pointer-events:none;z-index:999}
.tapfx i{position:absolute;left:0;top:0;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;border:2px solid #F5E6C8;opacity:0;animation:tapRing .75s cubic-bezier(.2,.7,.3,1) forwards}
.tapfx i:nth-child(2){border-color:var(--accent);animation-delay:.09s}
.tapfx i:nth-child(3){border:1.5px dashed rgba(245,230,200,.8);animation-delay:.18s;animation-duration:.9s}
.tapfx b{position:absolute;left:0;top:0;transform:translate(-50%,-50%);color:#FFD9A0;font-size:12px;text-shadow:0 0 8px rgba(232,66,15,.9);animation:tapSpark .6s ease-out forwards}
@keyframes tapRing{0%{opacity:.95;transform:scale(.4)}100%{opacity:0;transform:scale(5.2)}}
@keyframes tapSpark{0%{opacity:1;transform:translate(-50%,-50%) scale(.6) rotate(0)}100%{opacity:0;transform:translate(-50%,-130%) scale(1.3) rotate(90deg)}}
/* tile mode (square feed tile): the taste screen, quiet */
body.tile .taste-wrap{padding-top:80px;transform:scale(.86);transform-origin:top center}
body.tile .stickycta,body.tile .meter{display:none}
</style>

<body>
<div class="phone" id="phone">
  <section class="screen active" id="scr-taste">
    <img class="bgart tastebg" src="radiobg.jpg" alt="">
    <div class="tasteveil"></div>
    <div class="taste-wrap">
      <span class="eyebrow">Set your dial · 1 of 2</span>
      <h2 class="display qline" id="qline">Tap what you love.</h2>

      <div class="chips" id="tastechips"></div>
    </div>
    <div class="stickycta"><button class="btn primary display lockbtn" id="go1" onclick="if(!this.classList.contains('ready'))return nudge(1);go('scr-lineup')">Pick 3 to continue</button></div>
  </section>

  <section class="screen" id="scr-lineup">
    <div class="lineup-wrap">
      <span class="eyebrow">Set your dial · 2 of 2</span>

  </section>

  <section class="screen" id="scr-dial">
    <div class="dial-wrap">
      <span class="eyebrow">Your dial</span>
      <h2 class="display" id="dialname">My Dial</h2>

      <button class="again" onclick="restart()">↺ Build another</button>

  </section>

  <div id="birth" onclick="birthSkip()" role="dialog" aria-label="Your dial is being composed">
    <div id="birthwords"></div>
    <div id="birthorb"><span class="orbav" id="borb"></span><div id="birthsay"></div><div id="birthname" onclick="event.stopPropagation()"><span class="blab">Name your dial</span><span class="bfield"><input id="bnamein" maxlength="22" autocomplete="off" enterkeyhint="done"></span><span class="bsub" id="bnamesub">it’s yours — call it anything</span><button class="bdone" onclick="nameDone()">That’s it</button></div></div>
    <div id="birthband"><span class="brail"></span><span id="bneedle"></span><div id="birthrows"></div></div>
    <div id="birthskip">TAP TO SKIP</div>
  </div>
  <div class="toast" id="toast"></div>

function bi(k,s){s=s||12;const b=BRAND[k];return b?`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="${b.c}" aria-hidden="true" style="flex:0 0 auto;vertical-align:-1px"><path d="${b.d}"/></svg>`:'';}
const AUD={oq0:'onb_q0.mp3',oq1:'onb_q1.mp3',oq2:'onb_q2.mp3',oq3:'onb_q3.mp3'};
const IMG={kendrick:'kendrick.jpg',rihanna:'rihanna.jpg',eminem:'eminem.jpg',jelly:'jelly.jpg',sza:'sza.jpg',burna:'burna.jpg',electro:'electro.jpg',indie:'indie.jpg',jazz:'jazz.jpg',fenty:'fenty.jpg',afro:'afro.jpg',billie:'billie.jpg',olivia:'olivia.jpg',ariana:'ariana.jpg'};
let current='scr-taste';
function go(id,back){ const from=document.getElementById(current), to=document.getElementById(id);
  from.classList.remove('active'); from.classList.toggle('back',!back); to.classList.remove('back'); to.classList.add('active'); current=id; }
function toast(msg){ const t=document.getElementById('toast'); t.innerHTML=msg; t.classList.add('show'); clearTimeout(t._x); t._x=setTimeout(()=>t.classList.remove('show'),2400); }
document.querySelectorAll('[data-bi]').forEach(n=>{n.innerHTML=bi(n.dataset.bi,n.dataset.s?+n.dataset.s:10);});
/* ================= onboarding data ================= */
const tastes=['Hip-hop','R&B','Pop','Country','Afrobeats','Latin','Electronic','Indie','Jazz','Rock','Gospel','K-pop','Reggaetón','Soul','Drill','House',
  'NBA','Sneakers','Film','Anime','Fashion','Gaming','Comedy','Fitness','Skate','Cars'];
document.getElementById('tastechips').innerHTML=tastes.map(t=>`<button class="tchip" onclick="this.classList.toggle('on');this.classList.remove('suggest')">${t}</button>`).join('');
/* onboarding is the first conversation — the chips are what it hears */
const ONB_QS=[
  [()=>AUD.oq0,"From your intelligence.\nFor your information.\nLet's build an Agent Radio\n— ready?"],
  [()=>AUD.oq1,"What do you listen to\nwhen you want to relax?"],
  [()=>AUD.oq2,"When you're working out —\nwhat's playing?"],
  [()=>AUD.oq3,"Favorite genre.\nAll-time. Go."]
];
const onbAu=new Audio(); let onbIx=-1, onbT=null, onbOn=false;
/* the splash slogan types itself in — one letter at a time, in place */
const SLOGAN_LINES=[
  [["FROM ",0],["your",1],[" Intelligence.",0]],
  [["For ",0],["your",1],[" Information.",0]],
  [["Welcome to FYI Radio...",0]]
];
let sloganDone=false;
function sloganType(){
  if(sloganDone) return; sloganDone=true;
  const slots=[...document.querySelectorAll('#slogan [data-sl]')];
  if(!slots.length) return;
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){
    slots.forEach((el,li)=>{ el.innerHTML=SLOGAN_LINES[li].map(([t,it])=>it?'<i>'+t+'</i>':t).join(''); });
    return;
  }
  let li=0;
  const typeLine=()=>{
    if(li>=SLOGAN_LINES.length) return;
    const el=slots[li], segs=SLOGAN_LINES[li];
    let si=0, ci=0;
    const html=upto=>{
      let out='';
      for(let s=0;s<segs.length;s++){
        const [t,it]=segs[s];
        const take=s<si?t:(s===si?t.slice(0,upto):'');
        if(!take) continue;
        out+=it?'<i>'+take+'</i>':take;
      }
      return out;
    };
    const tick=()=>{
      ci++;
      if(ci>segs[si][0].length){ si++; ci=1; }
      if(si>=segs.length){
        el.innerHTML=html(0)+'';
        li++;
        if(li<SLOGAN_LINES.length) setTimeout(typeLine,320);
        return;
      }
      el.innerHTML=html(ci)+'<span class="scaret"></span>';
      setTimeout(tick,26+Math.random()*30);
    };
    setTimeout(tick,60);
  };
  setTimeout(typeLine,650);   /* after the arrival settles */
}
setTimeout(sloganType,900);   /* timer, not rAF — hidden tabs */
function onbType(txt){
  const el=document.getElementById('qline'); el.innerHTML='';
  const lines=txt.split('\n'); let li=0, ci=0;
  clearInterval(el._t);
  el._t=setInterval(()=>{
    if(li>=lines.length){ clearInterval(el._t); return; }
    ci++;
    el.innerHTML=lines.slice(0,li).join('<br>')+(li?'<br>':'')+lines[li].slice(0,ci);
    if(ci>=lines[li].length){ li++; ci=0; }
  },26);
}
function setWpp(speaking){
  const p=document.querySelector('.wippPlay'), z=document.querySelector('.wippPause');
  if(p&&z){ p.style.display=speaking?'none':'block'; z.style.display=speaking?'block':'none'; }
}
function onbToggle(ev){
  ev&&ev.stopPropagation();
  if(!onbOn){ onbOn=true; onbAsk(0,true); return; }
  const w=document.getElementById('onbwave');
  if(!onbAu.paused){
    onbAu.pause(); clearTimeout(onbT); w.classList.remove('speaking'); setWpp(false);
  } else if(onbAu.src && onbAu.currentTime>0 && !onbAu.ended){
    onbAu.play().then(()=>{ w.classList.add('speaking'); setWpp(true); }).catch(()=>{});
  } else {
    onbAsk(Math.max(onbIx,0),true);
  }
}
function onbAsk(i,manual){
  if(tasteRan && !manual) return;
  onbIx=i>=ONB_QS.length?1:i;
  const [src,txt]=ONB_QS[onbIx];
  onbType(txt);
  const w=document.getElementById('onbwave');
  onbAu.src=src(); onbAu.play().then(()=>{ w.classList.add('speaking'); setWpp(true); }).catch(()=>{});
  onbAu.onended=()=>{ w.classList.remove('speaking'); setWpp(false);
    if(onbIx+1>=ONB_QS.length) return; // one pass, then she rests — tap the wave to hear her again
    onbT=setTimeout(()=>onbAsk(onbIx+1),onbIx===0?1400:3600); };
}
function onbStart(){ if(onbOn) return; onbOn=true; setTimeout(()=>onbAsk(0),650); }
function onbHush(){ clearTimeout(onbT); try{onbAu.pause()}catch(e){} const w=document.getElementById('onbwave'); w&&w.classList.remove('speaking'); setWpp(false); }
const TASTE_MSG="Late-night hip-hop, some R&B… and I never miss a Lakers game.";
let tasteRan=false;
function chipByText(t){ return [...document.querySelectorAll('#tastechips .tchip')].find(c=>c.textContent.trim()===t); }
function sparkleChip(el){
  if(!el) return;
  el.classList.add('on','spark'); el.classList.remove('suggest');
  if(!matchMedia('(prefers-reduced-motion: reduce)').matches){
    for(let k=0;k<3;k++){ const sp=document.createElement('span'); sp.className='sp'; sp.textContent='✦';
      sp.style.left=(12+Math.random()*70)+'%'; sp.style.animationDelay=(k*90)+'ms';
      el.appendChild(sp); setTimeout(()=>sp.remove(),1100); }
  }
  setTimeout(()=>el.classList.remove('spark'),620);
}
function tasteTalk(ev){
  ev&&ev.stopPropagation();
  if(tasteRan) return; tasteRan=true;
  onbHush();
  const fld=document.getElementById('tasteField'); fld.classList.remove('cph'); fld.textContent='';
  let i=0;
  const tick=setInterval(()=>{ fld.textContent=TASTE_MSG.slice(0,++i); if(i>=TASTE_MSG.length){ clearInterval(tick); tasteHeard(); } },32);
}
function tasteHeard(){
  setTimeout(()=>{ document.getElementById('tasteReply').textContent='Say less. West coast after dark — and I’ll keep an ear on the League.'; },420);
  setTimeout(()=>sparkleChip(chipByText('Hip-hop')),950);
  setTimeout(()=>sparkleChip(chipByText('R&B')),1300);
  setTimeout(()=>{ const c=chipByText('NBA'); if(c){ c.textContent='NBA · Lakers'; sparkleChip(c); } },1750);
  setTimeout(()=>{ ['Drill','Soul'].forEach(t=>{ const c=chipByText(t); if(c&&!c.classList.contains('on')) c.classList.add('suggest'); }); },2400);
}
function bringStat(msg){
  const s=document.getElementById('bringstat'); if(!s) return;
  s.textContent=msg; s.classList.remove('on'); setTimeout(()=>s.classList.add('on'),30);
}
function tasteImport(b){
  if(b.dataset.done) return;
  b.dataset.done='1'; b.classList.add('conn');
  b.querySelector('.btop').innerHTML='<svg class="cchk" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" style="color:var(--live)"><path d="M4.5 12.5l5 5 10-11"/></svg>ChatGPT connected';
  b.querySelector('.hint').textContent='your taste came with you — 6 worlds lit above';
  let d=0;
  ['Hip-hop','Jazz','Soul','NBA','Film','Sneakers'].forEach(t=>{
    const c=chipByText(t)||chipByText('NBA · Lakers');
    if(c&&!c.classList.contains('on')){ d+=170; setTimeout(()=>sparkleChip(c),d); }
  });
}
function tasteGlean(n,btn){
  if(btn&&btn.classList.contains('conn')) return;
  if(btn) btn.classList.add('conn');
  const map={Spotify:['R&B','House'],Instagram:['Fashion','Sneakers'],TikTok:['Drill','Comedy'],YouTube:['Gaming','Film']};
  (map[n]||[]).forEach((t,i)=>{ const c=chipByText(t); if(c) setTimeout(()=>sparkleChip(c),220+i*240); });
  bringStat(n+' connected — '+(map[n]||[]).join(' and ')+' lit above');
}

const lineup=[
  ['Kendrick Lamar','kendrick'],['Rihanna','rihanna'],['Eminem','eminem'],['Jelly Roll','jelly'],
  ['SZA','sza'],['Burna Boy','burna'],['Fred again..','electro'],['Zach Bryan','indie'],
  ['Robert Glasper','jazz'],['Doja Cat','fenty'],['Karol G','afro'],
  ['Billie Eilish','billie'],['Olivia Rodrigo','olivia'],['Ariana Grande','ariana']
];

document.getElementById('lineupgrid').innerHTML=lineup.map(([n,k],i)=>`<button class="artist" onclick="pickArtist(this)">
    <img src="${IMG[k]}" alt=""><span class="nm">${n}</span>
    <span class="tick"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12.5l5 5 10-11"/></svg></span>
  </button>`).join('');

/* ============ gamified picks: 3 lights the way ============ */
const NEED=3;
function meter(n,k){ const m=document.getElementById('m'+n); [...m.querySelectorAll('i')].forEach((d,i)=>d.classList.toggle('on',i<k)); m.classList.toggle('full',k>=NEED);
  m.querySelector('span').textContent=k>=NEED?'nice — '+k+' picked':'pick '+(NEED-k)+' more';
  const b=document.getElementById('go'+n), was=b.classList.contains('ready'); b.classList.toggle('ready',k>=NEED);
  b.textContent=k>=NEED?(n===1?'Continue':'Build my dial'):(n===1?'Pick '+(NEED-k)+' more':'Pick '+(NEED-k)+' more artist'+(NEED-k===1?'':'s')); }
function nudge(n){ const b=document.getElementById('go'+n); b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake'); }
function pickChip(c){ const on=!c.classList.contains('on'); c.classList.toggle('on',on); if(on) sparkleChip(c); meter(1,document.querySelectorAll('#tastechips .tchip.on').length); }
function pickArtist(b){ b.classList.toggle('on'); b.classList.add('pop'); setTimeout(()=>b.classList.remove('pop'),160); meter(2,document.querySelectorAll('#lineupgrid .artist.on').length); }
document.querySelectorAll('#tastechips .tchip').forEach(c=>c.setAttribute('onclick','pickChip(this)'));
meter(1,0); meter(2,0);

/* ============ the birth of the dial (from the app, with a real naming beat) ============ */
const BEDS=['el3_bed.mp3','el_soul.mp3','el3_gfunk.mp3','el_club.mp3','el3_remix.mp3','el_slow.mp3','el3_complex.mp3'];
let birthTimers=[], birthDone=false, picks=[], dialName='My Dial';
function birthHarvest(){
  const chips=[...document.querySelectorAll('#tastechips .tchip.on')].map(c=>c.textContent.replace(/✦/g,'').trim());
  const said=tasteRan?TASTE_MSG.replace(/…/g,',').split(/,| and /).map(s=>s.trim().replace(/\.$/,'')).filter(s=>s.length>2):[];
  const on=[...document.querySelectorAll('#lineupgrid .artist.on')].map(b=>lineup.find(l=>l[0]===b.querySelector('.nm').textContent.trim()));
  return {chips:chips.length?chips:['Hip-hop','R&B','Soul'], said, artists:(on.length?on:lineup.slice(0,6))};
}
function birthType(el,txt,done){ let i=0; el.textContent=''; const t=setInterval(()=>{ el.textContent=txt.slice(0,++i); if(i>=txt.length){clearInterval(t); done&&done();} },26); birthTimers.push(t); }
const sched=(ms,fn)=>birthTimers.push(setTimeout(fn,ms));
function birthRun(){
  birthDone=false; birthTimers=[];
  const B=document.getElementById('birth'); B.className='on'; B.style.opacity='';
  const {chips,said,artists}=birthHarvest(); picks=artists.slice(0,6);
  const frags=[...said.map(s=>({t:s,a:0})),...chips.slice(0,6).map(t=>({t,a:0})),...picks.map(p=>({t:p[0],a:1}))].slice(0,13);
  const POS=[[12,14],[58,10],[30,22],[74,26],[8,33],[48,38],[68,46],[16,52],[40,58],[62,64],[24,70],[52,76],[10,80]];
  const W=document.getElementById('birthwords');
  W.innerHTML=frags.map((f,i)=>`<span class="bw${f.a?' a':''}" style="left:${POS[i][0]}%;top:${POS[i][1]}%;animation-delay:${i*90}ms,${700+i*90}ms">${f.t}</span>`).join('');
  const say=document.getElementById('birthsay'); say.innerHTML='';
  sched(700,()=>B.classList.add('orbin'));
  sched(1400,()=>{ const ph=B.clientWidth, pv=B.clientHeight;
    W.querySelectorAll('.bw').forEach((w,i)=>{ const r=w.getBoundingClientRect(), br=B.getBoundingClientRect();
      w.style.setProperty('--dx',(ph/2-(r.left-br.left)-r.width/2)+'px'); w.style.setProperty('--dy',(pv*0.34-(r.top-br.top))+'px');
      w.style.animationDelay=(i*60)+'ms'; w.classList.add('pull'); }); });
  sched(2600,()=>{ W.innerHTML='';
    const bits=[chips[0],chips[1],(picks[0]||[''])[0].split(' ')[0]].filter(Boolean);
    birthType(say, bits.join('. ')+". I've got you."); });
  /* the naming: the dial waits for its name */
  sched(4600,()=>{ say.innerHTML=''; B.classList.add('naming');
    const inp=document.getElementById('bnamein'); inp.value=''; inp.placeholder='My Dial'; setTimeout(()=>{ try{inp.focus()}catch(e){} },60); });
}
function nameDone(){
  const B=document.getElementById('birth'), nm=document.getElementById('birthname'), inp=document.getElementById('bnamein');
  dialName=(inp.value.trim()||'My Dial'); inp.blur(); nm.classList.add('set'); document.getElementById('bnamesub').textContent='✓ '+dialName+' is on the air';
  setTimeout(()=>compose(),900);
}
document.addEventListener('keydown',e=>{ if(e.key==='Enter'&&document.getElementById('birth').classList.contains('naming')) nameDone(); });
function compose(){
  const B=document.getElementById('birth'), say=document.getElementById('birthsay');
  B.classList.remove('naming'); document.getElementById('birthname').classList.remove('set');
  say.innerHTML='<span class="dim">Composing '+dialName+'</span>';
  sched(800,()=>{ say.innerHTML=''; B.classList.add('burst');
    const rows=document.getElementById('birthrows'), band=document.getElementById('birthband');
    const br=band.getBoundingClientRect(), Bx=B.getBoundingClientRect(); const orbY=B.clientHeight*0.34-(br.top-Bx.top);
    rows.innerHTML=picks.map((p,i)=>{ const ty=28+i*52;
      return `<span class="brow" style="top:${ty}px;--fx:${(B.clientWidth/2-104)}px;--fy:${(orbY-ty)}px;transition-delay:${i*130}ms,${i*130}ms">
        <span class="bav"><img src="${IMG[p[1]]}" alt=""><span class="blv" style="animation-delay:${500+i*130}ms"></span></span>
        <span class="bnm">${p[0]}</span></span>`; }).join('');
    requestAnimationFrame(()=>B.classList.add('composing'));
    const nd=document.getElementById('bneedle'); nd.classList.remove('lock'); nd.style.top='43px';
    sched(1200,()=>{ nd.style.top=(28+(picks.length-1)*52+15)+'px'; });
    sched(2200,()=>{ nd.style.top='43px'; });
    sched(3000,()=>{ nd.classList.add('lock'); });
    sched(4400,birthEnd); });
}
function birthSkip(){ const B=document.getElementById('birth'); if(B.classList.contains('naming')) return; if(!birthDone) birthEnd(); }
function birthEnd(){
  if(birthDone) return; birthDone=true;
  birthTimers.forEach(t=>{clearTimeout(t);clearInterval(t);}); birthTimers=[];
  if(!picks.length) picks=birthHarvest().artists.slice(0,6);
  const B=document.getElementById('birth'); B.classList.add('out'); setTimeout(()=>{ B.className=''; },560);
  renderDial(); go('scr-dial');
}
/* ============ your dial ============ */
const radio=new Audio(); radio.loop=true; let muted=false, tuned=-1;
function renderDial(){
  document.getElementById('dialname').textContent=dialName;
  document.getElementById('dialsub').textContent=picks.length+' stations · always on air. Tap one to tune in.';
  const band=document.getElementById('dband'); band.querySelectorAll('.drow2').forEach(r=>r.remove());
  picks.forEach((p,i)=>{ const b=document.createElement('button'); b.className='drow2'; b.style.top=(i*58)+'px'; b.style.animationDelay=(i*80)+'ms';
    b.innerHTML=`<span class="dav2"><img src="${IMG[p[1]]}" alt=""></span><span><b>${p[0]}</b><small>${p[0].split(' ')[0]} Radio</small></span><span class="lv"><i></i>LIVE</span>`;
    b.onclick=()=>tune(i); band.appendChild(b); });
  tuned=-1; document.getElementById('dneedle').style.top='24px';
}
function tune(i){
  tuned=i; document.querySelectorAll('.drow2').forEach((r,k)=>r.classList.toggle('on',k===i));
  document.getElementById('dneedle').style.top=(i*58+24)+'px';
  radio.src=BEDS[i%BEDS.length]; radio.muted=muted; radio.play().catch(()=>{});
}
function restart(){ radio.pause(); document.querySelectorAll('#tastechips .tchip,#lineupgrid .artist').forEach(c=>c.classList.remove('on','suggest')); meter(1,0); meter(2,0); picks=[]; go('scr-taste',true); }
/* tile vs opened */
const isTile=innerWidth<380&&innerHeight<380&&Math.abs(innerWidth-innerHeight)<40;
document.body.classList.toggle('tile',isTile);
/* the app was laid out for a full phone screen (~800pt tall); in the shorter creation frame, render it at
   phone size and scale it down to fit, keeping the top clear of the host app's close button */
function fit(){ if(isTile) return; const ph=document.getElementById('phone'), s=Math.min(1,innerHeight/660);
  ph.style.width=(innerWidth/s)+'px'; ph.style.height=(innerHeight/s)+'px'; ph.style.transform=s<1?'scale('+s+')':'';
  document.documentElement.style.setProperty('--topin',Math.round(100/s)+'px'); }
fit(); addEventListener('resize',fit);

document.addEventListener('pointerdown',e=>{ if(isTile) return; const f=document.createElement('span'); f.className='tapfx';
  f.style.left=e.clientX+'px'; f.style.top=e.clientY+'px'; f.innerHTML='<i></i><i></i><i></i><b>✦</b>'; document.body.appendChild(f); setTimeout(()=>f.remove(),1100); },{passive:true});
document.addEventListener('visibilitychange',()=>{ if(document.hidden){ radio.pause(); try{onbHush()}catch(e){} } });
window.MarcDial={ mute(m){ muted=!!m; radio.muted=muted; onbAu.muted=muted; if(m){ radio.pause(); try{onbHush()}catch(e){} } } };
</script>
</body>
