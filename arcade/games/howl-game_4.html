<!--
=====================================================================
 HOWL! (LIKE MONKEY)  -  a Warm Leche mini game
 Self-contained: all code, pixel art, font and audio are inline.

 GAMEPLAY
   You are the monkey. Hop from palm tree to palm tree and drop
   coconuts on the fat cats (top hats, monocles) waddling below.
   Five cats, unlocked over time: grey 10 pts, white 15, orange stripe 20,
   tuxedo 25, charcoal 30 (each faster and more alert than the last).
   Cats sometimes notice ("!") and scoot out of the way, so lead your shots.
   Each bonk squishes a cat and showers paper cash + gold coins; the 3rd
   bonk squashes it flat (triple points) and it vanishes. Cats arrive in
   groups and more crowd in as the game goes on.
   Background: black night sky with stars and a smiling moon (upper right).
   Coconuts dropped mid-jump keep some of your momentum.
   Consecutive bonks build a combo (max x5); a miss resets it.
   40 second clock, +1.5s per bonk, +3s per squash, -1s per miss. Game over when time runs out.

 CONTROLS
   Keyboard: Left/Right or A/D = jump to next tree,
             Space / Down / S = drop coconut, Enter/Space = start, M = mute.
   Touch/mouse: tap a tree to jump to it, tap your own tree to drop.
   Tap the speaker icon (top right) to mute. Music starts on first tap.
   The game pauses automatically when the page is hidden.

 SIZES
   172x172 / 354x354 tiles (near-square and < 380px): simplified
   title card ("HOWL!" + TAP TO PLAY). Screen width x ~456: full game.
   Fixed 216px-tall pixel canvas, width follows the aspect ratio.

 APP INTEGRATION
   Every event is sent through ALL of these (when present):
     window.onGameOver(score, details)               (gameOver only)
     window.ReactNativeWebView.postMessage(json)
     window.webkit.messageHandlers.howl.postMessage(msg)
         (falls back to messageHandlers.game / .gameEvent)
     window.Android.onGameEvent(json)
     window.parent.postMessage(msg, '*')
     window CustomEvent  'howl:<type>'  (detail = data)
   msg  = { game: 'howl', type: <type>, data: {...} },  json = JSON of msg

   Event types:
     ready     {}
     start     {}
     jump      { tree }
     drop      { drops }
     hit       { score, combo, hits, cat, hpLeft }  cat = grey | white | stripe | tux | charcoal
     squash    { score, cat }                  3rd bonk on a cat
     miss      {}
     gameOver  { score, best, time, hits, drops, newBest }

   API:  window.HowlGame
     .start()            start / restart a run
     .mute(bool)         mute (true) or unmute (false)
     .setAudio(src)      swap the music (url or data: URI; null = chiptune fallback)
     .getState()         { state, score, best, combo, hits, drops, timeLeft, time, muted, paused, tree }

   Best score is saved in localStorage key 'howl_best' (try/catch wrapped).
   Music: 33s loop (1:02-1:35) from "Howl (like monkey)" by Warm Leche.
=====================================================================

function drawCatSpr(c,x,ground,kind,flip,squash){
  var pal=CATS[kind], rows=CAT, L=18, n=rows.length, sq=squash||0;
  var sh=Math.max(0.12,1-sq*0.35), wf=1+Math.min(1,sq*0.18);
  for(var r=0;r<n;r++){var row=rows[r];
    var y0=Math.round(ground-(n-r)*S*sh), y1=Math.round(ground-(n-r-1)*S*sh);
    if(y1<=y0)continue;
    for(var i=0;i<L;i++){var ch=flip?row[L-1-i]:row[i]; if(ch==='.')continue;
      var x0=Math.round(x+(i*S-18)*wf), x1=Math.round(x+((i+1)*S-18)*wf);
      c.fillStyle=pal[ch]||CATBASE[ch]; c.fillRect(x0,y0,x1-x0,y1-y0);}}
}

var AC=null, out=null;
function unlockAudio(){
  unlocked=true;

    if(pr&&pr.catch)pr.catch(function(){});}

function tone(f,t,d,type,v,f2){

  try{var o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
  if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(out);o.start(t);o.stop(t+d+0.03);}catch(e){}
}
var fbOn=false,fbNext=0,fbStep=0,fbTimer=null;

// ---------- game logic ----------
function pickKind(){ // unlock tougher cats over time
  var maxK=Math.min(CATKINDS.length,2+Math.floor(tGame/9));
  var r=Math.random(); r=Math.pow(r,0.8);
  return CATKINDS[Math.floor(r*maxK)];}
function newWalker(fromLeft){
  var kind=pickKind();
  return {kind:kind,x:fromLeft?-18:W+18,dir:fromLeft?1:-1,speed:(rnd(26,36)+Math.min(25,tGame*0.4))*CATS[kind].spd,
    openAt:-1,dodge:0,ddir:0,stun:0,pause:0,turnT:rnd(1.2,3),hp:3,dying:0};
}
function start(){
  if(TILE){forceFull=true;resize();}
  state='play';score=0;combo=1;hits=0;drops=0;tGame=0;timeLeft=40;newBest=false;paused=false;
  nuts=[];parts=[];pops=[];
  walkers=[newWalker(true),newWalker(false)];
  walkers[0].x=W*0.2;walkers[1].x=W*0.8;catT=2;
  mk.tree=Math.floor(trees.length/2);mk.jumping=false;mk.x=trees[mk.tree].x;mk.y=MK_Y();mk.cool=0;mk.howlT=0;
  banner={txt:'GO!',t:1.1};hintT=4.5;
  unlockAudio();sfx('start');emit('start',{});
}
function jumpTo(k){
  k=Math.max(0,Math.min(trees.length-1,k));
  var cur=mk.jumping?mk.toTree:mk.tree;
  if(k===cur&&!mk.jumping)return;
  var hops=Math.abs(k-(mk.jumping?mk.toTree:mk.tree))||1;
  mk.fromX=mk.x;mk.toX=trees[k].x;mk.toTree=k;mk.jt=0;
  mk.jdur=Math.min(0.5,0.2+0.06*hops);mk.jumping=true;mk.flip=mk.toX<mk.fromX;
  sfx('jump');emit('jump',{tree:k});
}
function drop(){
  if(state!=='play'||mk.cool>0)return;
  var inAir=nuts.filter(function(n){return !n.done;}).length;
  if(inAir>=2)return;
  var vx=mk.jumping?(mk.toX-mk.fromX)/mk.jdur*0.45:0;
  var n={x:mk.x,y:mk.y+20,vx:vx,vy:30,g:430,done:false};
  nuts.push(n);drops++;mk.cool=0.28;mk.dropT=0.25;sfx('drop');
  // walkers may notice
  var pA=Math.min(0.8,0.2+tGame*0.011), react=Math.max(0.18,0.46-tGame*0.004);
  var T=Math.sqrt(2*((GROUND-30)-n.y)/n.g), land=n.x+vx*T;
  walkers.forEach(function(w){
    if(w.dodge>0||w.stun>0||w.openAt>=0)return;
    var wx=w.x+w.dir*w.speed*T*(w.pause>0?0:1);
    if(Math.abs(land-wx)<50&&Math.random()<pA*CATS[w.kind].alert){w.openAt=tGame+react/CATS[w.kind].alert;w.land=land;}
  });
  emit('drop',{drops:drops});
}
function money(x,y,nCash,nCoin){
  if(parts.length>260)return;
  for(var i=0;i<nCash;i++)parts.push({k:'cash',x:x+rnd(-6,6),y:y,vx:rnd(-70,70),vy:rnd(-150,-70),life:rnd(1.8,2.6),ph:rnd(0,6)});
  for(var j=0;j<nCoin;j++)parts.push({k:'coin',x:x+rnd(-4,4),y:y,vx:rnd(-90,90),vy:rnd(-200,-110),life:rnd(1.3,1.9),ph:rnd(0,6),b:0});
  sfx('coins');
}
function puff(x,y,n,cols,sp){for(var i=0;i<n;i++)parts.push({x:x,y:y,vx:rnd(-sp,sp),vy:rnd(-sp*1.4,-sp*0.2),life:rnd(0.3,0.7),c:cols[i%cols.length]});}
function pop(x,y,txt,col){pops.push({x:x,y:y,t:0,txt:txt,c:col});}
function gameOver(){
  state='over';overT=0;newBest=score>best;
  if(newBest){best=score;try{localStorage.setItem('howl_best',String(best));}catch(e){}}
  walkers.forEach(function(w){w.openAt=-1;});
  sfx('over');
  emit('gameOver',{score:score,best:best,time:Math.round(tGame),hits:hits,drops:drops,newBest:newBest});
}

function update(dt){
  tAll+=dt;
  if(paused)return;
  if(banner){banner.t-=dt;if(banner.t<=0)banner=null;}
  if(hintT>0)hintT-=dt;
  var playing=state==='play';
  if(playing){tGame+=dt;timeLeft-=dt;if(timeLeft<=0){timeLeft=0;gameOver();}}
  if(state==='over')overT+=dt;

  // monkey
  mk.cool-=dt;mk.dropT-=dt;mk.howlT-=dt;
  if(mk.jumping){
    mk.jt+=dt;var u=Math.min(1,mk.jt/mk.jdur);
    mk.x=mk.fromX+(mk.toX-mk.fromX)*u;mk.y=MK_Y()-Math.sin(Math.PI*u)*(16+6*Math.abs(mk.toX-mk.fromX)/60);
    if(u>=1){mk.jumping=false;mk.tree=mk.toTree;mk.x=mk.toX;mk.y=MK_Y();puff(mk.x,TT,3,[P.g,P.G],30);}
  }
  if(state==='title'&&!mk.jumping&&Math.random()<dt*0.5){
    if(Math.random()<0.5)mk.howlT=0.8; else jumpTo(mk.tree+(Math.random()<0.5?-1:1));
  }

  // walkers
  if(playing){
    var want=Math.min(W>300?7:5,3+Math.floor(tGame/12));
    catT-=dt;
    if(walkers.length<want&&catT<=0){ // cats arrive in groups
      var grp=Math.min(want-walkers.length,1+Math.floor(Math.random()*3));
      for(var gi=0;gi<grp;gi++){var nw=newWalker(Math.random()<0.5);nw.x+=nw.dir*-gi*26;walkers.push(nw);}
      catT=rnd(1.5,3);
    }
  }else if(state==='title'&&walkers.length===0){
    ['stripe','grey','tux'].forEach(function(k,i){var nw=newWalker(i%2===0);nw.kind=k;nw.x=W*(0.2+i*0.3);walkers.push(nw);});}
  for(var wi=walkers.length-1;wi>=0;wi--){var dw=walkers[wi];
    if(dw.dying>0){dw.dying-=dt;if(dw.dying<=0){puff(dw.x,GROUND-8,14,['#ffffff','#e0d6f0','#b9a8d0'],70);walkers.splice(wi,1);}}}
  walkers.forEach(function(w){
    if(w.dying>0)return;
    if(w.stun>0){w.stun-=dt;return;}
    if(w.openAt>=0&&tGame>=w.openAt){w.openAt=-1;w.dodge=0.5;w.pause=0;
      var dd=w.x>=w.land?1:-1; if(w.x<30)dd=1; if(w.x>W-30)dd=-1; w.dir=dd;sfx('open');}
    if(w.dodge>0){w.dodge-=dt;w.x+=w.dir*95*dt;w.x=Math.max(14,Math.min(W-14,w.x));return;}
    if(w.pause>0){w.pause-=dt;}
    else{
      w.x+=w.dir*w.speed*dt;
      if(w.x<12&&w.dir<0)w.dir=1; if(w.x>W-12&&w.dir>0)w.dir=-1;
      w.turnT-=dt;
      if(w.turnT<=0){w.turnT=rnd(1,3);var r=Math.random();
        if(r<0.35)w.dir*=-1; else if(r<0.55)w.pause=rnd(0.3,0.8);}
    }
  });

  // nuts
  for(var i=nuts.length-1;i>=0;i--){var n=nuts[i];
    n.vy+=n.g*dt;n.x+=n.vx*dt;n.y+=n.vy*dt;
    if(n.done){if(n.y>H+10||n.x<-20||n.x>W+20)nuts.splice(i,1);continue;}
    var res=null,hw=null;
    for(var j=0;j<walkers.length&&!res;j++){var w=walkers[j];
      var top=GROUND-38*(1-(3-w.hp)*0.18*0.35);
      if(w.stun<=0&&!(w.dying>0)&&n.y+3>=top&&n.y<GROUND&&Math.abs(n.x-w.x)<=13+(3-w.hp)){res='hit';hw=w;}
    }
    if(res==='hit'){
      n.done=true;n.vy=-rnd(90,130);n.vx=rnd(-60,60);
      hw.dodge=0;hw.openAt=-1;hw.hp--;
      hits++;var base=CATS[hw.kind].pts, pts=base*combo;combo=Math.min(5,combo+1);
      mk.howlT=0.8;sfx('bonk');setTimeout(function(){sfx('howl');},120);
      puff(n.x,n.y,8,[P.c,P.w,CATS[hw.kind].B],70);
      if(hw.hp<=0){
        hw.dying=0.8;hw.stun=0;pts+=base*2*combo;score+=pts;timeLeft=Math.min(60,timeLeft+3);
        money(hw.x,GROUND-20,12,14);sfx('squash');
        pop(hw.x,GROUND-44,'SQUASHED! +'+pts,P.y);
        emit('squash',{score:score,cat:hw.kind});
      }else{
        hw.stun=0.6;score+=pts;timeLeft=Math.min(60,timeLeft+1.5);
        money(hw.x,GROUND-28,4,6);
        pop(hw.x,GROUND-50,'BONK! +'+pts,P.y);
      }
      emit('hit',{score:score,combo:combo,hits:hits,cat:hw.kind,hpLeft:hw.hp});
      continue;
    }
    if(n.y>=GROUND-3){
      puff(n.x,GROUND-2,8,[P.n,P.N,P.o],55);
      if(state==='play'){combo=1;timeLeft=Math.max(0,timeLeft-1);pop(n.x,GROUND-14,'MISS -1S',P.s);emit('miss',{});}
      nuts.splice(i,1);
    }
  }
  for(var k=parts.length-1;k>=0;k--){var p=parts[k];p.life-=dt;
    if(p.k==='cash'){ // flutter down
      if(p.y<GROUND-2){p.vy=Math.min(p.vy+160*dt,26);p.vx=p.vx*(1-2*dt)+Math.sin(tAll*5+p.ph)*90*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;}
      else{p.y=GROUND-2;}
    }else if(p.k==='coin'){
      p.vy+=420*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;
      if(p.y>GROUND-2){p.y=GROUND-2;if(p.b<2){p.vy*=-0.45;p.vx*=0.6;p.b++;}else{p.vy=0;p.vx=0;}}
    }else{p.vy+=220*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;
      if(p.y>GROUND){p.y=GROUND;p.vy*=-0.3;p.vx*=0.6;}}
    if(p.life<=0)parts.splice(k,1);}
  for(var q=pops.length-1;q>=0;q--){pops[q].t+=dt;pops[q].y-=18*dt;if(pops[q].t>0.9)pops.splice(q,1);}
}

function monkeyMode(){return mk.howlT>0?'howl':mk.jumping?'jump':mk.dropT>0?'drop':'idle';}

function renderTile(){
  var c=ctx; c.drawImage(bg,0,0);
  text(c,'HOWL!',W/2,15,3,P.y,'c');   // below the feed tile's creator chip (top ~17 units)
  // little frond + monkey holding coconut
  var howl=Math.floor(tAll*1.5)%2===0;
  var bob=Math.round(Math.abs(Math.sin(tAll*3))*-3);
  drawMonkey(c,24,32+bob,howl?'howl':'idle',!howl,tAll,true);
  // falling coconut
  var u=(tAll*0.9)%1;
  spr(c,NUT,56,22+Math.round(u*u*12),2);
  drawWalker(c,{x:62,dir:-1,stun:0,pause:0,dodge:0,openAt:-1,kind:'stripe'},76,tAll);
  // no "TAP TO PLAY" here: the tile's own title and stats sit over that strip, and the whole tile is the button
}

function render(){
  if(TILE){renderTile();return;}
  var c=ctx; c.drawImage(bg,0,0);
  trees.forEach(function(t){drawFronds(c,t.x,TT,leafLen);});
  walkers.forEach(function(w){drawWalker(c,w,GROUND,tAll+w.speed);});
  for(var i=0;i<nuts.length;i++)drawNut(c,nuts[i]);
  drawMonkey(c,Math.round(mk.x),Math.round(mk.y),monkeyMode(),state==='play'&&mk.cool<=0&&nuts.filter(function(n){return !n.done;}).length<2,tAll);
  for(var k=0;k<parts.length;k++)drawPart(c,parts[k]);
  for(var q=0;q<pops.length;q++){var o=pops[q];text(c,o.txt,o.x,Math.round(o.y),1,o.c,'c');}

  drawMute(c);
  if(state==='title'){
    text(c,'BEST '+best,4,5,1,P.T);
    text(c,'HOWL!',W/2,82,5,P.y,'c');
    text(c,'LIKE MONKEY',W/2,112,2,P.c,'c');
    text(c,'HOP TREE TO TREE',W/2,130,1,P.T,'c');
    text(c,'BONK THE FAT CATS',W/2,138,1,P.T,'c');
    if(Math.floor(tAll*2.5)%3!==2)text(c,'TAP TO PLAY',W/2,152,2,P.c,'c');
    text(c,'WARM LECHE',W/2,GROUND+7,1,P.m,'c');
    return;
  }
  // HUD
  text(c,String(score),4,4,2,P.c);
  if(combo>1)text(c,'X'+combo,6+textW(String(score),2)+4,4,2,P.y);
  var tl=Math.ceil(timeLeft);
  if(state==='play')text(c,String(tl),W/2,4,2,tl<=10&&Math.floor(tAll*4)%2?P.r:P.T,'c');
  if(banner)text(c,banner.txt,W/2,100,2,P.c,'c');
  if(state==='play'&&hintT>0){
    text(c,'TAP A TREE TO JUMP',W/2,124,1,P.c,'c');
    text(c,'TAP YOUR TREE TO DROP',W/2,133,1,P.c,'c');
  }

  if(state==='over'){
    var bw=Math.min(W-16,150),bx=Math.round((W-bw)/2);
    rect(c,bx,74,bw,82,P.o);rect(c,bx+2,76,bw-4,78,'#24121c');rect(c,bx+2,76,bw-4,2,P.m);
    text(c,'TIME UP!',W/2,84,2,P.r,'c');
    text(c,'SCORE '+score,W/2,102,2,P.c,'c');
    if(newBest){if(Math.floor(tAll*4)%2)text(c,'NEW BEST!',W/2,120,1,P.y,'c');}
    else text(c,'BEST '+best,W/2,120,1,P.T,'c');
    text(c,'BONKS '+hits,W/2,129,1,P.T,'c');
    if(overT>0.8&&Math.floor(tAll*2.5)%3!==2)text(c,'TAP TO RETRY',W/2,142,1,P.c,'c');
  }
  if(paused){
    rect(c,0,88,W,40,'rgba(7,4,10,0.85)');
    text(c,'PAUSED',W/2,96,2,P.c,'c');text(c,'TAP TO RESUME',W/2,114,1,P.T,'c');
  }
}

// ---------- input ----------
function toCanvas(e){var r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H};}
function unlockAudioOnly(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();out=AC.createGain();out.gain.value=0.22;out.connect(AC.destination);}catch(e){AC=null;}}}
function nearestTree(x){var b=0,bd=1e9;for(var i=0;i<trees.length;i++){var d=Math.abs(trees[i].x-x);if(d<bd){bd=d;b=i;}}return b;}
cv.addEventListener('pointerdown',function(e){
  e.preventDefault();
  var p=toCanvas(e);
  if(!TILE&&p.x>W-22&&p.y<20){unlocked=true;unlockAudioOnly();setMute(!muted);return;}
  unlockAudio();
  if(paused){paused=false;startMusic();return;}
  if(state==='title'){start();return;}
  if(state==='over'){if(overT>0.8)start();return;}
  var k=nearestTree(p.x), cur=mk.jumping?mk.toTree:mk.tree;
  if(k===cur)drop(); else jumpTo(k);
});
window.addEventListener('keydown',function(e){
  var k=e.key;
  if(['ArrowLeft','ArrowRight','ArrowDown','ArrowUp',' '].indexOf(k)>=0)e.preventDefault();
  if(e.repeat)return;
  if(k==='m'||k==='M'){unlockAudioOnly();unlocked=true;setMute(!muted);return;}
  unlockAudio();
  if(paused){paused=false;startMusic();return;}
  if(state==='title'||state==='over'){
    if((k===' '||k==='Enter')&&(state==='title'||overT>0.8))start();
    return;
  }
  var cur=mk.jumping?mk.toTree:mk.tree;
  if(k==='ArrowLeft'||k==='a'||k==='A')jumpTo(cur-1);
  else if(k==='ArrowRight'||k==='d'||k==='D')jumpTo(cur+1);
  else if(k===' '||k==='Enter'||k==='ArrowDown'||k==='s'||k==='S')drop();
});
document.addEventListener('visibilitychange',function(){
  if(document.hidden){if(state==='play')paused=true;stopMusic();}
  else if(state!=='play'){startMusic();}
});
window.addEventListener('resize',resize);

// ---------- loop ----------
var last=0;
function frame(ts){
  var dt=last?Math.min(0.05,(ts-last)/1000):0.016; last=ts;
  update(dt);render();
  requestAnimationFrame(frame);
}

window.HowlGame={
  start:start,
  mute:function(b){setMute(b===undefined?true:!!b);},
  setAudio:function(src){stopMusic();if(src){musicFailed=false;music.src=src;}else{musicFailed=true;music.removeAttribute('src');}startMusic();},
  getState:function(){return{state:state,score:score,best:best,combo:combo,hits:hits,drops:drops,timeLeft:Math.round(timeLeft*10)/10,time:Math.round(tGame*10)/10,muted:muted,paused:paused,tree:mk.tree};}
};

resize();
requestAnimationFrame(frame);
emit('ready',{});
})();
</script>
