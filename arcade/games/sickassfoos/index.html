<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#101010;color:#fff;-webkit-tap-highlight-color:transparent}
body{font-family:Roboto,system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch}
a{color:inherit;text-decoration:none}
.page{max-width:520px;margin:0 auto;padding-bottom:calc(env(safe-area-inset-bottom) + 28px)}
/* header: logo, then "Project by will.i.am" with his photo */
.top{display:flex;align-items:center;justify-content:space-between;height:104px;padding:0 14px 0 8px}
.top .logo{height:74px;width:auto;object-fit:contain;opacity:.92}
.by{display:flex;align-items:center;gap:10px;text-align:right;line-height:1.2;font-size:15px}

.cover{display:block;width:calc(100% - 20px);margin:0 10px;border-radius:14px;aspect-ratio:1;object-fit:cover}
img.sl{display:block;width:100%;height:auto}
/* the gold frame's side lines run behind the cards */
.sec{background:linear-gradient(#f2c200,#f2c200) 3.03% 0/1px 100% no-repeat,linear-gradient(#f2c200,#f2c200) 96.97% 0/1px 100% no-repeat}
.gap{height:28px}
/* video facade */
.vid{position:relative;display:block;width:calc(100% - 20px);margin:0 10px;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#222;border:0;cursor:pointer}
.vid img,.vid iframe{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border:0}
.vid .host{position:absolute;left:10px;top:10px;padding:5px 10px;border-radius:6px;background:rgba(40,40,44,.85);color:#bbb;font-size:12px}
.vid .play{position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;background:rgba(0,0,0,.55);display:grid;place-items:center;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.vid .play svg{width:26px;height:26px;fill:#fff;margin-left:3px}
/* streaming cards */
.card{display:flex;align-items:center;gap:14px;width:calc(100% - 20px);border:0;font:inherit;color:inherit;text-align:left;cursor:pointer;padding:0;margin:0 10px;min-height:124px;border-radius:14px;background:#1b1b1d;overflow:hidden;transition:transform .15s,background .15s}
.card:active{transform:scale(.985);background:#242427}
.card .art{flex:none;width:124px;height:124px;background:#3a3a3d;display:grid;place-items:center}
.card .art img{width:100%;height:100%;object-fit:cover;display:block}
.card .art svg{width:100%;height:100%}
.card .tx{flex:1;min-width:0;padding:10px 0}
/* the services copy their link instead of leaving the app */
.card .cp{flex:none;margin-right:12px;width:34px;height:34px;border-radius:50%;background:#2c2c30;display:grid;place-items:center;color:#cfcfd4}
.card .cp svg{width:17px;height:17px}
.card.ok .cp{background:#f2c200;color:#101010}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translate(-50%,20px);opacity:0;padding:10px 16px;border-radius:999px;background:#f2c200;color:#101010;font-size:14px;font-weight:700;white-space:nowrap;pointer-events:none;transition:opacity .2s,transform .2s;z-index:9}
#toast.on{opacity:1;transform:translate(-50%,0)}
.card .tt{font-size:16px;font-weight:500;line-height:1.25;color:#fff;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden}
.card .st{margin-top:6px;font-size:13px;line-height:1.3;color:#8f8f95;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.foot{width:100%;display:block;margin-top:10px}
/* tile mode (a feed/drafts thumbnail): just the cover */
@media (max-width:380px) and (max-height:380px){
  .top,h1,.vidsec,.listen,.foot{display:none}.cover{width:100%;margin:0;border-radius:0}html,body{overflow:hidden}}
</style></head><body><div class="page">
