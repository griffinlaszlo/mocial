<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Pressure (Drake ice remix)</title>
<!--
  PRESSURE — DRAKE ICE REMIX. A remix of Where's West?'s Pressure visualizer, rebuilt as a hands-off
  audio visualizer for "2 Hard 4 The Radio". Starts from the original's "glacier" ring artwork, regraded
  to white + ice blue; on every bass hit the rings punch and split, frost rings echo outward (the OG's ring
  echoes), a radial spectrum + circular waveform wrap the rings, and the ice cracks.
  No interaction. window.DrakeIce = { mute(bool), getState() }.
-->
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#eaf6ff;-webkit-user-select:none;user-select:none}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  #go{position:absolute;inset:0;display:none;align-items:flex-end;justify-content:center;padding-bottom:22px;font:700 12px/1 -apple-system,Helvetica,Arial,sans-serif;letter-spacing:.2em;color:#4a86b8;text-transform:uppercase;cursor:pointer}
  #go.on{display:flex}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="go">tap to thaw</div>
<script>
(function(){
  const cv=document.getElementById('c'), g=cv.getContext('2d');
  let W=0,H=0,D=1, tile=false;
  function size(){ D=Math.min(2,devicePixelRatio||1); W=innerWidth; H=innerHeight; cv.width=W*D; cv.height=H*D; g.setTransform(D,0,0,D,0,0);
    tile=W<380&&H<380&&Math.abs(W-H)<40; }
  size(); addEventListener('resize',size);

  /* ---- the OG artwork, iced: luminance mapped onto white / ice blue ---- */
  let ice=null;
  const src=new Image(); src.src='rings.webp';
  src.onload=()=>{ const n=720, o=document.createElement('canvas'); o.width=o.height=n; const x=o.getContext('2d'); x.drawImage(src,0,0,n,n);
    const d=x.getImageData(0,0,n,n), p=d.data;
    const lo=[120,186,236], mid=[214,238,255], hi=[255,255,255];
    for(let i=0;i<p.length;i+=4){ const l=(p[i]*.3+p[i+1]*.59+p[i+2]*.11)/255;
      const a=l<.5?lo:mid, b=l<.5?mid:hi, t=l<.5?l*2:(l-.5)*2;
      p[i]=a[0]+(b[0]-a[0])*t; p[i+1]=a[1]+(b[1]-a[1])*t; p[i+2]=a[2]+(b[2]-a[2])*t;
      const px=(i/4)%n/n-.5, py=Math.floor(i/4/n)/n-.5, dd=Math.hypot(px,py);   // fade to a circle: no square edges
      p[i+3]=255*Math.max(0,Math.min(1,(.5-dd)/.06)); }
    x.putImageData(d,0,0); ice=o; };

  /* ---- audio ---- */
  const au=new Audio('2hard.mp3'); au.loop=true; au.preload='auto'; let ctx=null, an=null, fq=null, td=null, muted=false;
  function wire(){ if(ctx) return; const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return; ctx=new AC();
    const s=ctx.createMediaElementSource(au); an=ctx.createAnalyser(); an.fftSize=1024; an.smoothingTimeConstant=.72;
    fq=new Uint8Array(an.frequencyBinCount); td=new Uint8Array(an.fftSize); s.connect(an); an.connect(ctx.destination); }
  function start(){ wire(); if(ctx&&ctx.state==='suspended') ctx.resume(); au.muted=muted; au.play().then(()=>go.classList.remove('on')).catch(()=>go.classList.add('on')); }
  const go=document.getElementById('go'); go.onclick=start;
  if(!tile) start();

  /* ---- state ---- */
  let bass=0, avg=.25, last=0, kick=0, shake=0, glitch=0, t0=performance.now(); const scars=[];
  const rings=[], cracks=[], flakes=Array.from({length:70},()=>({x:Math.random(),y:Math.random(),r:.6+Math.random()*1.8,v:.02+Math.random()*.05,w:Math.random()*6}));
  function crack(cx,cy,R){ // a branching lightning crack from the ring edge outward
    const a0=Math.random()*Math.PI*2, segs=[];
    (function grow(x,y,a,len,depth){ let px=x,py=y; const n=5+Math.random()*5|0;
      for(let i=0;i<n;i++){ a+=(Math.random()-.5)*.9; const nx=px+Math.cos(a)*len, ny=py+Math.sin(a)*len; segs.push([px,py,nx,ny,depth]); px=nx; py=ny;
        if(depth<3&&Math.random()<.28) grow(px,py,a+(Math.random()<.5?-1:1)*(.5+Math.random()*.6),len*.7,depth+1); } })(cx+Math.cos(a0)*R*.92,cy+Math.sin(a0)*R*.92,a0+(Math.random()-.5)*.6,R*.12,0);
    cracks.push({segs,life:1}); }

  function frame(now){ requestAnimationFrame(frame);
    const t=(now-t0)/1000;
    let spec=null, wave=null, live=an&&!au.paused;
    if(live){ an.getByteFrequencyData(fq); an.getByteTimeDomainData(td); spec=fq; wave=td;
      let b=0; for(let i=1;i<7;i++) b+=fq[i]; bass=b/6/255; }
    else { bass=.35+.25*Math.max(0,Math.sin(t*4.3))**6+.08*Math.sin(t*1.7); }
    avg+=(bass-avg)*.02;
    const isKick = bass>avg*1.18 && bass>.42 && now-last>230;
    const cx=W/2, cy=H*.47, S=Math.min(W,H*.92)*.86, R=S*.42;
    if(isKick){ last=now; kick=1; shake=Math.min(14,4+bass*14); rings.push({r:R*.9,life:1}); const nc=bass>.6?4:bass>.5?3:2; for(let k=0;k<nc;k++) crack(cx,cy,R*(1+kick*.08)); if(bass>.6) glitch=1; }
    kick*=.9; shake*=.82; glitch*=.86;
    g.save(); if(shake>.3) g.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);

    // frosted backdrop
    const bg=g.createRadialGradient(cx,cy,R*.2,cx,cy,Math.max(W,H)*.8); bg.addColorStop(0,'#ffffff'); bg.addColorStop(1,'#cfe6f7');
    g.fillStyle=bg; g.fillRect(0,0,W,H);
    // the OG rings: punch on bass, RGB/ice split on kicks
    if(ice){ const k=1+bass*.18+kick*.1, s=S*k;
      if(kick>.15){ g.globalAlpha=.35*kick; g.globalCompositeOperation='multiply';
        g.drawImage(ice,cx-s/2-10*kick,cy-s/2,s,s); g.drawImage(ice,cx-s/2+10*kick,cy-s/2+4*kick,s,s); g.globalCompositeOperation='source-over'; g.globalAlpha=1; }
      g.save(); g.translate(cx,cy); g.rotate(Math.sin(t*.4)*.05+kick*.12*Math.sin(now*.01)); g.drawImage(ice,-s/2,-s/2,s,s); g.restore(); }
    // frost echoes (the OG's ring echoes, gone icy)
    for(let i=rings.length-1;i>=0;i--){ const r=rings[i]; r.r+=R*.055; r.life-=.022; if(r.life<=0){ rings.splice(i,1); continue; }
      g.strokeStyle=`rgba(120,190,240,${r.life*.8})`; g.lineWidth=2+6*r.life; g.setLineDash([2,10]); g.beginPath(); g.arc(cx,cy,r.r,0,Math.PI*2); g.stroke(); g.setLineDash([]); }
    // radial spectrum around the outer ring
    const N=120; g.save(); g.translate(cx,cy); g.shadowColor='rgba(80,170,240,.9)'; g.shadowBlur=14;
    for(let i=0;i<N;i++){ const f=i<N/2?i:N-1-i; const v=spec?spec[2+Math.floor(f*1.6)]/255:(.25+.2*Math.sin(t*3+i*.3)*Math.sin(t*1.3+i*.07));
      const a=i/N*Math.PI*2-Math.PI/2, r0=R*1.02+kick*R*.05, len=R*(.05+v*v*1.05+kick*.15);
      g.strokeStyle=v>.75?'#ffffff':'rgba(150,215,255,.95)'; g.lineWidth=Math.max(1.5,R*.016);
      g.beginPath(); g.moveTo(Math.cos(a)*r0,Math.sin(a)*r0); g.lineTo(Math.cos(a)*(r0+len),Math.sin(a)*(r0+len)); g.stroke(); }
    // circular waveform riding the inner ring
    g.lineWidth=2.5; g.strokeStyle='#ffffff'; g.beginPath();
    for(let i=0;i<=180;i++){ const a=i/180*Math.PI*2; const v=wave?(wave[Math.floor(i/180*(wave.length-1))]-128)/128:Math.sin(t*6+i*.4)*.15*bass;
      const r=R*.62+v*R*.45*(1+kick); const x=Math.cos(a)*r, y=Math.sin(a)*r; i?g.lineTo(x,y):g.moveTo(x,y); }
    g.closePath(); g.stroke(); g.restore();
    // waveform band across the bottom
    g.save(); g.shadowColor='rgba(80,170,240,.8)'; g.shadowBlur=10; g.strokeStyle='rgba(255,255,255,.95)'; g.lineWidth=2; g.beginPath();
    const by=H*.9; for(let i=0;i<=W;i+=3){ const v=wave?(wave[Math.floor(i/W*(wave.length-1))]-128)/128:Math.sin(t*5+i*.05)*.2*bass; const y=by+v*H*.09*(1+kick); i?g.lineTo(i,y):g.moveTo(i,y); } g.stroke(); g.restore();
    // cracks
    for(let i=scars.length-1;i>=0;i--){ const c=scars[i]; c.life-=.006; if(c.life<=0){ scars.splice(i,1); continue; }
      g.strokeStyle=`rgba(110,175,230,${c.life*.45})`; g.lineWidth=1; g.beginPath(); for(const [x1,y1,x2,y2] of c.segs){ g.moveTo(x1,y1); g.lineTo(x2,y2); } g.stroke(); }
    for(let i=cracks.length-1;i>=0;i--){ const c=cracks[i]; c.life-=.03; if(c.life<=0){ cracks.splice(i,1); scars.push({segs:c.segs,life:1}); if(scars.length>14) scars.shift(); continue; }
      g.save(); g.shadowColor='rgba(60,160,255,1)'; g.shadowBlur=12; g.lineCap='round';
      const show=Math.min(c.segs.length,Math.ceil(c.segs.length*Math.min(1,(1-c.life)*5)));
      for(let j=0;j<show;j++){ const [x1,y1,x2,y2,dp]=c.segs[j]; g.strokeStyle=`rgba(255,255,255,${c.life})`; g.lineWidth=Math.max(.6,3.2-dp); g.beginPath(); g.moveTo(x1,y1); g.lineTo(x2,y2); g.stroke(); }
      g.restore(); }
    // snow / ice dust
    g.fillStyle='rgba(255,255,255,.9)';
    for(const f of flakes){ f.y+=f.v*(1+bass*2)/60; if(f.y>1.05){ f.y=-.05; f.x=Math.random(); } const x=(f.x+Math.sin(t*.6+f.w)*.01)*W, y=f.y*H; g.beginPath(); g.arc(x,y,f.r*(1+kick*.6),0,Math.PI*2); g.fill(); }
    g.restore();
    // glitch slices on the hardest hits
    if(glitch>.15){ const n=4+Math.random()*5|0; for(let k=0;k<n;k++){ const y=Math.random()*H, h=6+Math.random()*28, dx=(Math.random()-.5)*60*glitch;
      g.drawImage(cv,0,y*D,W*D,h*D,dx,y,W,h); g.fillStyle=`rgba(170,225,255,${.25*glitch})`; g.fillRect(0,y,W,1.5); } }
    // kick flash
    if(kick>.6){ g.fillStyle=`rgba(255,255,255,${(kick-.6)*.6})`; g.fillRect(0,0,W,H); }
  }
  requestAnimationFrame(frame);
  document.addEventListener('visibilitychange',()=>{ if(document.hidden) au.pause(); else if(!tile&&!muted) au.play().catch(()=>{}); });
  window.DrakeIce={ mute(m){ muted=!!m; au.muted=muted; if(m) au.pause(); }, getState(){ return {playing:!au.paused,t:au.currentTime,live:!!an,bass:+bass.toFixed(2)}; } };
})();
</script>
</body>
</html>
