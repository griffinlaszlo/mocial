<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Jimmy’s Vinyl Room</title>
<link rel="stylesheet" href="room.css?v=1791344874"></head><body>
<div class="room" id="room">
  <div class="stage" id="stage">
    <img class="photo" id="photo" alt="Jimmy’s vinyl room">
    <div class="glow chand"></div><div class="glow paint"></div><div class="glow paint2"></div><div class="glow floor"></div>
    <div id="lightsHost"></div>
    <canvas class="fx" id="fx"></canvas>
    <div class="deckpos"><div class="tilt"><div class="shadow"></div><div class="disc" id="disc"><div class="lab"><img id="label" alt=""></div></div></div></div>
    <button class="hit" id="hit" aria-label="Play or pause"></button>
    <button class="sk p" id="pv" aria-label="Previous"><svg viewBox="0 0 24 24"><path d="M19 5.5v13L9.5 12zM5 5.5h2.5v13H5z"/></svg></button>
    <button class="sk n" id="nx" aria-label="Next"><svg viewBox="0 0 24 24"><path d="M5 5.5v13l9.5-6.5zM16.5 5.5H19v13h-2.5z"/></svg></button>
    <div class="rack" id="rack"></div>
  </div>
  <div class="hud"><div class="alb" id="alb"></div><div class="sub2" id="sub2"></div><div class="trk" id="trk"></div><div class="note"><span></span></div></div>
  <div class="bar"><i id="bar"></i></div><span id="pp" hidden></span>
  <button class="start hide" id="start"><span>Tap to drop the needle</span></button>
</div>
<script src="data.js?v=1791344874"></script><script>window.ROOM_THEME="classic"</script><script src="room.js?v=1791344874"></script></body></html>
