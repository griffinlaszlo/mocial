<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Visualizer</title>
<!--
  BOND VISUALIZER: what ChatGPT builds when a fan asks for "a visualizer with <artist>".
  Any artist: ?art=<image path> &audio=<song path> &name=<artist> &song=<title> (paths from the site root).
  The artist's art spins at the center; the song's spectrum wraps around it in colours pulled from the art.
  Tap to switch between three looks (bars, rings, wave). In a feed tile it runs silent on a synthetic beat;
  opened in the viewer (iframe.embed.live) it plays the song. window.BondMaker = { mute(bool) }.
-->
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#000;-webkit-user-select:none;user-select:none;font-family:-apple-system,'Helvetica Neue',Arial,sans-serif;-webkit-tap-highlight-color:transparent}
  #bg{position:absolute;inset:-12%;width:124%;height:124%;object-fit:cover;filter:blur(42px) brightness(.42) saturate(1.5)}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:pointer}
  #cap{position:absolute;left:0;right:0;bottom:22px;text-align:center;color:#fff;font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;opacity:.85;pointer-events:none;text-shadow:0 1px 8px rgba(0,0,0,.5)}
  #hint{display:block;margin-top:6px;font-weight:500;letter-spacing:.08em;opacity:.7;transition:opacity 1s}
  #go{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:none;padding:12px 20px;border-radius:999px;background:rgba(0,0,0,.55);color:#fff;font-size:14px;font-weight:700;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);pointer-events:none}
  #go.on{display:block}
</style>
</head>
<body>
<img id="bg" alt="">
<canvas id="cv"></canvas>
<div id="go">▶ Tap to play</div>
<div id="cap"><span id="title"></span><span id="hint">Tap to switch the look</span></div>
<script>
(function(){
  const q=new URLSearchParams(location.search), ROOT='../../';
  const ART=ROOT+(q.get('art')||'f/art-olivia.jpg'), AUDIO=q.get('audio')?ROOT+q.get('audio'):'', NAME=q.get('name')||'', SONG=q.get('song')||'';
  const cv=document.getElementById('cv'), x=cv.getContext('2d'), bg=document.getElementById('bg'), go=document.getElementById('go');
  document.getElementById('title').textContent=SONG?`${SONG} · ${NAME}`:NAME;
  bg.src=ART;
  const live=(()=>{ try{ const f=window.frameElement; return !f||f.classList.contains('live'); }catch(e){ return true; } })();
  let W=0,H=0,DPR=1; function size(){ DPR=Math.min(2,devicePixelRatio||1); W=innerWidth; H=innerHeight; cv.width=W*DPR; cv.height=H*DPR; x.setTransform(DPR,0,0,DPR,0,0); } size(); addEventListener('resize',size);

  // palette: the most saturated hues in the art (falls back to warm white)
  let pal=['#ffffff','#ffd1e8','#9fd8ff']; const img=new Image(); let ready=false;
  img.onload=()=>{ ready=true; try{ const c=document.createElement('canvas'); c.width=c.height=24; const g=c.getContext('2d'); g.drawImage(img,0,0,24,24); const d=g.getImageData(0,0,24,24).data; const b={};
    for(let i=0;i<d.length;i+=4){ const r=d[i],gg=d[i+1],bb=d[i+2],mx=Math.max(r,gg,bb),mn=Math.min(r,gg,bb); if(mx-mn<40||mx<60) continue; let h=0,dd=mx-mn; h=mx===r?((gg-bb)/dd)%6:mx===gg?(bb-r)/dd+2:(r-gg)/dd+4; h=Math.round(((h*60)+360)%360/30); b[h]=(b[h]||0)+(mx-mn); }
    const top=Object.entries(b).sort((p,q)=>q[1]-p[1]).slice(0,3).map(([h])=>`hsl(${h*30} 95% 68%)`); if(top.length) pal=[...top,'#ffffff'].slice(0,3); }catch(e){} };
  img.src=ART;

  // audio: real spectrum when the song plays, a synthetic beat otherwise (tiles, or before the first tap)
  let el=null, actx=null, an=null, bins=null, muted=!live, playing=false;
  function ensure(){ if(el||!AUDIO) return; el=new Audio(AUDIO); el.loop=true; el.preload='auto';
    try{ const AC=window.AudioContext||window.webkitAudioContext; actx=new AC(); const s=actx.createMediaElementSource(el); an=actx.createAnalyser(); an.fftSize=256; an.smoothingTimeConstant=.78; bins=new Uint8Array(an.frequencyBinCount); s.connect(an); an.connect(actx.destination); }catch(e){ an=null; } }
  function play(){ if(muted||!AUDIO) return; ensure(); if(actx&&actx.state==='suspended') actx.resume(); const p=el.play(); if(p&&p.then) p.then(()=>{ playing=true; go.classList.remove('on'); },()=>{ go.classList.add('on'); }); else playing=true; }
  if(!live) document.getElementById('cap').style.display='none';   // as a tile or a station's art, just the visual
  window.BondMaker={ mute(m){ muted=!!m; if(muted){ if(el) el.pause(); playing=false; go.classList.remove('on'); } else play(); } };
  if(live) play();

  const N=64, lv=new Float32Array(N); let mode=0, rot=0, t0=performance.now(), parts=[], lastKick=0, flash=0;
  function levels(t){
    if(playing&&an){ an.getByteFrequencyData(bins); for(let i=0;i<N;i++){ const k=Math.min(bins.length-1,Math.floor(Math.pow(i/N,1.6)*bins.length*.85)); lv[i]+=((bins[k]/255)-lv[i])*.5; } }
    else { const beat=(t/1000*2.1)%1, kick=Math.exp(-beat*7); for(let i=0;i<N;i++){ const v=(.25+.35*Math.sin(t/700+i*.45)*Math.sin(t/1300+i*.17)+(i<12?kick*.6:kick*.15)); lv[i]+=(Math.max(.04,v)-lv[i])*.25; } }
  }
  function disc(cx,cy,R){
    x.save(); x.beginPath(); x.arc(cx,cy,R,0,Math.PI*2); x.clip();
    if(ready){ const s=Math.max(img.width,img.height)/Math.min(img.width,img.height); x.translate(cx,cy); x.rotate(rot); const w=R*2*(img.width>img.height?s:1), h=R*2*(img.height>img.width?s:1); x.drawImage(img,-w/2,-h/2,w,h); }
    else { x.fillStyle='#222'; x.fill(); }
    x.restore(); x.beginPath(); x.arc(cx,cy,R,0,Math.PI*2); x.lineWidth=3; x.strokeStyle='rgba(255,255,255,.9)'; x.stroke();
    x.beginPath(); x.arc(cx,cy,R*.09,0,Math.PI*2); x.fillStyle='#000'; x.fill();
  }
  function frame(t){
    requestAnimationFrame(frame); levels(t);
    let bass=0; for(let i=0;i<8;i++) bass+=lv[i]; bass/=8;
    const cx=W/2, cy=H*.47, base=Math.min(W,H)*.2, R=base*(1+bass*.16);
    rot+=.003+bass*.012; x.clearRect(0,0,W,H);
    if(flash>0){ x.fillStyle=`rgba(255,255,255,${flash*.18})`; x.fillRect(0,0,W,H); flash*=.9; }
    if(bass>.55&&t-lastKick>220){ lastKick=t; for(let i=0;i<10;i++){ const a=Math.random()*Math.PI*2; parts.push({x:cx+Math.cos(a)*R,y:cy+Math.sin(a)*R,vx:Math.cos(a)*(1.5+Math.random()*3),vy:Math.sin(a)*(1.5+Math.random()*3),l:1,c:pal[i%pal.length]}); } }
    parts=parts.filter(p=>(p.l-=.016)>0); parts.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; x.globalAlpha=p.l; x.fillStyle=p.c; x.beginPath(); x.arc(p.x,p.y,2.5,0,Math.PI*2); x.fill(); }); x.globalAlpha=1;
    x.lineCap='round';
    if(mode===0){   // bars wrapping the disc, mirrored so the ring is symmetric
      for(let i=0;i<N*2;i++){ const v=lv[i<N?i:N*2-1-i], a=i/(N*2)*Math.PI*2-Math.PI/2, r0=R+10, r1=r0+8+v*base*1.1;
        x.strokeStyle=pal[Math.floor(i/(N*2)*pal.length*2)%pal.length]; x.lineWidth=Math.max(2,base*.045);
        x.beginPath(); x.moveTo(cx+Math.cos(a)*r0,cy+Math.sin(a)*r0); x.lineTo(cx+Math.cos(a)*r1,cy+Math.sin(a)*r1); x.stroke(); } }
    else if(mode===1){   // rings: each band of the spectrum is a pulsing ring
      for(let k=0;k<6;k++){ let v=0; for(let i=k*10;i<k*10+10;i++) v+=lv[i]; v/=10; x.strokeStyle=pal[k%pal.length]; x.globalAlpha=.35+v*.65; x.lineWidth=2+v*10;
        x.beginPath(); x.arc(cx,cy,R+14+k*(base*.2)+v*base*.25,0,Math.PI*2); x.stroke(); } x.globalAlpha=1; }
    else {   // a waveform circling the disc
      for(let pass=0;pass<2;pass++){ x.strokeStyle=pal[pass]; x.lineWidth=pass?2:4; x.globalAlpha=pass?.9:.6; x.beginPath();
        for(let i=0;i<=N*2;i++){ const j=i%(N*2), v=lv[j<N?j:N*2-1-j], a=i/(N*2)*Math.PI*2-Math.PI/2+(pass?.03:0), r=R+18+v*base*(pass?.7:.9)*Math.sin(t/300+i*.3+pass);
          const px=cx+Math.cos(a)*r, py=cy+Math.sin(a)*r; i?x.lineTo(px,py):x.moveTo(px,py); } x.stroke(); } x.globalAlpha=1; }
    disc(cx,cy,R);
  }
  requestAnimationFrame(frame);
  cv.addEventListener('pointerdown',()=>{ mode=(mode+1)%3; flash=1; document.getElementById('hint').style.opacity=0; if(!muted&&!playing) play(); });
})();
</script>
</body>
</html>
