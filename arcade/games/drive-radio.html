.stations{top:5%}.station .icon{font-size:6cqw}.meter:after{display:none}
/* Station-wide motion: every moving layer follows the same pace. */
#desert:checked~.game{--speed:1.8s;--travel:5s;--bounce:.3s;--wheel:.18s;--needle:13deg;--beat:.45s}
#forest:checked~.game{--speed:4.5s;--travel:12.5s;--bounce:.85s;--wheel:.45s;--needle:58deg;--beat:1.1s}
#night:checked~.game{--speed:.7s;--travel:1.95s;--bounce:.12s;--wheel:.07s;--needle:-48deg;--beat:.18s}
.game .dash{animation-duration:var(--speed)}
.game .dash:nth-child(2){animation-delay:calc(var(--speed) * -.2)}
.game .dash:nth-child(3){animation-delay:calc(var(--speed) * -.4)}
.game .dash:nth-child(4){animation-delay:calc(var(--speed) * -.6)}
.game .dash:nth-child(5){animation-delay:calc(var(--speed) * -.8)}
.game .scenery{animation-duration:var(--travel)}
.game .scenery.b{animation-delay:calc(var(--travel) * -.5)}
.game .scenery.c{animation-delay:calc(var(--travel) * -.25)}
.game .scenery.d{animation-delay:calc(var(--travel) * -.75)}
.game .car{animation-duration:var(--bounce)}
.game .tire{animation:tread var(--wheel) linear infinite}
.game .equalizer i{animation-duration:var(--beat)!important}
.game .meter:before{transform:rotate(var(--needle));transition:transform .6s ease}
@keyframes tread{to{background-position:0 1.4cqw}}
/* Cool mountain forest: tall firs, violet peaks, mist and a dirt road. */
#forest:checked~.game{background:linear-gradient(#777bd1,#c4d8ee 44%);--accent:#c8ffe9}
#forest:checked~.game .hills{height:36%;bottom:55%;filter:none;background:linear-gradient(145deg,#d8e9ef 0 24%,#767ca8 25% 48%,#454d83 49%);clip-path:polygon(0 100%,0 65%,10% 30%,18% 57%,34% 0,50% 69%,62% 35%,71% 56%,88% 8%,100% 49%,100% 100%)}
#forest:checked~.game .ground{background:repeating-linear-gradient(8deg,#174b48 0 1cqw,#1b5550 1cqw 1.6cqw)}
#forest:checked~.game .ground:after{background:#46827666;clip-path:none;height:10%;box-shadow:0 -2cqw 3cqw #c6e8de88}
#forest:checked~.game .road{background:repeating-linear-gradient(0deg,#ffffff05 0 .5cqw,#00000005 .5cqw 1cqw),linear-gradient(90deg,#685450,#a08973 50%,#685450)}
#forest:checked~.game .edge{background:#a7b09b;box-shadow:none;width:.7%}
#forest:checked~.game .dash{opacity:.4;background:#e3d8b5}
#forest:checked~.game .barrier{display:none}
#forest:checked~.game .cloud{top:39%;left:25%;width:70%;height:3%;opacity:.35;filter:blur(1cqw);animation-duration:60s}
#forest:checked~.game .scenery{height:24%;top:25%;width:12%}
#forest:checked~.game .plant:before{top:-310%;height:370%;left:-300%;width:700%;border-radius:0;clip-path:polygon(50% 0,75% 27%,65% 27%,87% 51%,74% 51%,100% 80%,66% 90%,50% 100%,15% 91%,0 80%,26% 51%,13% 51%,35% 27%,25% 27%);background:linear-gradient(90deg,#133c39,#33987b 40%,#237661 55%,#0c423f);box-shadow:none}
#forest:checked~.game .plant:after{display:none}
#forest:checked~.game .music-note{animation-duration:3.5s}
#forest:checked~.game .station.two{background:linear-gradient(#8c91d4 0 45%,#1e6654 45%)}
/* Fast city: brighter windows, neon road glow and passing light streaks. */
#night:checked~.game .barrier{display:none}
#night:checked~.game .ground:after{display:none}
#night:checked~.game .road{background:linear-gradient(90deg,#392873,#151c38 35%,#18233f 65%,#522658)}
#night:checked~.game .dash{background:#42f9ff;box-shadow:0 0 1cqw #1ff0ff}
#night:checked~.game .edge{box-shadow:0 0 1.2cqw #ff23ec}
#night:checked~.game .scenery{height:22%;top:27%}
#night:checked~.game .music-note{animation-duration:.9s}
.speed-streaks{display:none;position:absolute;inset:45% 0 0;z-index:6;pointer-events:none;overflow:hidden}
#night:checked~.game .speed-streaks{display:block}
.speed-streaks:before,.speed-streaks:after{content:'';position:absolute;top:0;left:23%;width:.4cqw;height:14cqw;background:linear-gradient(transparent,#a4faff);transform-origin:top;animation:rush .48s linear infinite}
.speed-streaks:after{left:auto;right:23%;animation-name:rush-right;animation-delay:-.24s;background:linear-gradient(transparent,#ffbaff)}
@keyframes rush{from{transform:translate(12cqw,-15cqw) rotate(30deg);opacity:0}40%{opacity:.6}to{transform:translate(-25cqw,55cqw) rotate(30deg);opacity:0}}
@keyframes rush-right{from{transform:translate(-12cqw,-15cqw) rotate(-30deg);opacity:0}40%{opacity:.6}to{transform:translate(25cqw,55cqw) rotate(-30deg);opacity:0}}
@media(prefers-reduced-motion:reduce){.game .tire{animation:none}.speed-streaks{display:none!important}}
