<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="64" height="64" shape-rendering="crispEdges">
  <!-- mocial fm: a little boombox, antenna up -->
  <path d="M22 9 L28 2" stroke="#000" stroke-width="1"/>
  <rect x="27" y="1" width="2" height="2" fill="#e03a3a"/>
  <rect x="3" y="7" width="26" height="4" fill="#9a9a9a" stroke="#000"/>
  <rect x="11" y="5" width="10" height="2" fill="#9a9a9a" stroke="#000"/>
  <rect x="2" y="10" width="28" height="17" fill="#c8c8c8" stroke="#000"/>
  <rect x="3" y="11" width="26" height="1" fill="#fff"/>
  <!-- speakers -->
  <circle cx="8.5" cy="19.5" r="4.5" fill="#333" stroke="#000"/>
  <circle cx="8.5" cy="19.5" r="2" fill="#777"/>
  <circle cx="23.5" cy="19.5" r="4.5" fill="#333" stroke="#000"/>
  <circle cx="23.5" cy="19.5" r="2" fill="#777"/>
  <!-- the LCD in the middle, tuned in -->
  <rect x="13" y="13" width="6" height="5" fill="#10205a" stroke="#000"/>
  <rect x="14" y="16" width="1" height="1" fill="#6fd0ff"/><rect x="15" y="15" width="1" height="2" fill="#6fd0ff"/>
  <rect x="16" y="14" width="1" height="3" fill="#6fd0ff"/><rect x="17" y="15" width="1" height="2" fill="#6fd0ff"/>
  <!-- buttons -->
  <rect x="13" y="20" width="2" height="2" fill="#e03a3a" stroke="#000" stroke-width="0.5"/>
  <rect x="17" y="20" width="2" height="2" fill="#5a5a5a" stroke="#000" stroke-width="0.5"/>
  <rect x="13" y="24" width="6" height="1" fill="#777"/>
</svg>
