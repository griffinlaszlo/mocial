# GitHub Pages builds the site with Jekyll, which publishes every file in the
# repo unless it's listed here. These are docs, tools and files the site never
# loads, so they stay in the repo but not on mocial.org.
exclude:
  - README.md
  - WORKLOG.md
  - archive-old-content.txt
  - Griff_SkiMan_Vector.ai
  - converter
  - shop/README.md
  - shop/build_colorways.py
  - random
  - skiing pics
